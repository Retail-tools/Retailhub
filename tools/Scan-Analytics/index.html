<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Analytics — Duplicate &amp; Pattern Detection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --burgundy-900:#4A0C1B; --burgundy-800:#5C1022; --burgundy-700:#6E1226; --burgundy-600:#86182F;
  --burgundy-500:#A32540; --burgundy-050:#F7E9EC;
  --ink:#201A1C; --ink-2:#4C4247; --ink-3:#7C7075; --ink-4:#A79B9F;
  --paper:#FFFFFF; --canvas:#F7F4F2; --raise:#FFFFFF; --sunk:#FBF8F7;
  --line:#E7E0DE; --line-2:#D6CCC9;
  --r-critical:#7A0C20; --r-high:#B0451A; --r-moderate:#95721A; --r-low:#456B55; --r-normal:#7C7075;
  --r-critical-bg:#F8E7EA; --r-high-bg:#FBEDE4; --r-moderate-bg:#F8F2DF; --r-low-bg:#E9F1EB; --r-normal-bg:#F1EDEC;
  --ok:#2F6B4F; --warn:#9A6B12; --bad:#93131F;
  --shadow-sm:0 1px 2px rgba(74,12,27,.06);
  --shadow-md:0 6px 20px -8px rgba(74,12,27,.18);
  --radius:10px; --radius-lg:14px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --burgundy-050:#3A1018; --burgundy-500:#D9758A; --burgundy-600:#C55C74; --burgundy-700:#B34A63;
    --ink:#F3EBEA; --ink-2:#D3C5C7; --ink-3:#A29295; --ink-4:#7E6E72;
    --paper:#221A1D; --canvas:#171113; --raise:#271E21; --sunk:#1E1719;
    --line:#3A2E32; --line-2:#4A3B40;
    --r-critical:#E8798C; --r-high:#E29163; --r-moderate:#D4BC63; --r-low:#84B79A; --r-normal:#A29295;
    --r-critical-bg:#3A1620; --r-high-bg:#38221A; --r-moderate-bg:#332C15; --r-low-bg:#1C2B23; --r-normal-bg:#2A2226;
    --ok:#7FBF9B; --warn:#D8B26A; --bad:#E8798C;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --burgundy-050:#3A1018; --burgundy-500:#D9758A; --burgundy-600:#C55C74; --burgundy-700:#B34A63;
  --ink:#F3EBEA; --ink-2:#D3C5C7; --ink-3:#A29295; --ink-4:#7E6E72;
  --paper:#221A1D; --canvas:#171113; --raise:#271E21; --sunk:#1E1719;
  --line:#3A2E32; --line-2:#4A3B40;
  --r-critical:#E8798C; --r-high:#E29163; --r-moderate:#D4BC63; --r-low:#84B79A; --r-normal:#A29295;
  --r-critical-bg:#3A1620; --r-high-bg:#38221A; --r-moderate-bg:#332C15; --r-low-bg:#1C2B23; --r-normal-bg:#2A2226;
  --ok:#7FBF9B; --warn:#D8B26A; --bad:#E8798C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{height:100%}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:25px;line-height:1.2}
h2{font-size:19px}
h3{font-size:16px}
p{margin:0 0 10px}
a{color:var(--burgundy-600)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--burgundy-500);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:flex;height:100%;min-height:100vh}
.sidebar{width:246px;flex:0 0 246px;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand img{height:30px;display:block;margin-bottom:10px}
.brand .prod{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--burgundy-700);line-height:1.1}
.brand .sub{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.35}
.nav{flex:1;overflow-y:auto;padding:10px 10px 16px}
.nav-group{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);padding:14px 10px 6px;font-weight:600}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;color:var(--ink-2);font-size:13.5px;cursor:pointer;margin-bottom:1px}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.active{background:var(--burgundy-050);color:var(--burgundy-700);font-weight:600}
.nav button .ic{width:16px;height:16px;flex:0 0 16px;opacity:.85}
.nav button .pill{margin-left:auto;font-size:10.5px;font-family:var(--mono);background:var(--r-critical-bg);color:var(--r-critical);padding:1px 6px;border-radius:20px}
.nav button:disabled{opacity:.38;cursor:not-allowed}
.side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-4);display:flex;justify-content:space-between;align-items:center;gap:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px}
.topbar .crumb{font-size:11.5px;color:var(--ink-3);margin-bottom:2px}
.topbar .sp{flex:1}
.page{padding:22px 26px 60px;max-width:1500px;width:100%}
@media(max-width:960px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  .nav{display:flex;gap:4px;overflow-x:auto;padding:8px}
  .nav button{width:auto;white-space:nowrap}
  .nav-group,.side-foot{display:none}
  .page{padding:16px 14px 50px}
  .topbar{padding:12px 14px}
}

/* ---------- primitives ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.card-h .sp{flex:1}
.card-b{padding:18px}
.card-b.tight{padding:0}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.xs{font-size:11px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);padding:7px 13px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--burgundy-500);color:var(--burgundy-700)}
.btn.primary{background:var(--burgundy-700);border-color:var(--burgundy-700);color:#fff}
.btn.primary:hover{background:var(--burgundy-600);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line-2);color:var(--ink-3);background:var(--paper)}
input[type=text],input[type=number],input[type=search],select{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0}
input:focus,select:focus{border-color:var(--burgundy-500);outline:none}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--line-2);background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--burgundy-700);border-color:var(--burgundy-700);color:#fff}
.chip.btn-like{cursor:pointer}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:5px;letter-spacing:.02em;white-space:nowrap}
.tag.critical{background:var(--r-critical-bg);color:var(--r-critical)}
.tag.high{background:var(--r-high-bg);color:var(--r-high)}
.tag.moderate{background:var(--r-moderate-bg);color:var(--r-moderate)}
.tag.low{background:var(--r-low-bg);color:var(--r-low)}
.tag.normal{background:var(--r-normal-bg);color:var(--r-normal)}
.tag.neutral{background:var(--sunk);color:var(--ink-2);border:1px solid var(--line)}
.divider{height:1px;background:var(--line);margin:16px 0}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;position:relative;overflow:hidden}
.kpi .k{font-size:11.5px;color:var(--ink-3);margin-bottom:5px}
.kpi .v{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11px;color:var(--ink-4);margin-top:4px}
.kpi.accent{border-left:3px solid var(--burgundy-600)}
.kpi.crit{border-left:3px solid var(--r-critical)}
.kpi.high{border-left:3px solid var(--r-high)}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;max-width:100%}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.tbl th{position:sticky;top:0;background:var(--sunk);text-align:left;font-weight:600;font-size:11px;letter-spacing:.03em;color:var(--ink-3);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
table.tbl th.sortable{cursor:pointer;user-select:none}
table.tbl th.sortable:hover{color:var(--burgundy-600)}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tbody tr:hover{background:var(--sunk)}
table.tbl tr.clickable{cursor:pointer}
table.tbl td.r,table.tbl th.r{text-align:right}
table.tbl td.c,table.tbl th.c{text-align:center}
table.tbl tr.flagged td{background:color-mix(in srgb,var(--r-critical-bg) 55%,transparent)}
.rowmark{display:inline-block;width:3px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:7px}

/* ---------- misc ---------- */
.dropzone{border:1.5px dashed var(--line-2);border-radius:var(--radius-lg);padding:38px 24px;text-align:center;background:var(--sunk);cursor:pointer}
.dropzone.over{border-color:var(--burgundy-500);background:var(--burgundy-050)}
.bar{height:8px;border-radius:5px;background:var(--sunk);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.meter{display:flex;align-items:center;gap:8px}
.score{font-family:var(--mono);font-weight:500;font-size:13px}
.steps{display:flex;flex-direction:column;gap:7px}
.step{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-3)}
.step.done{color:var(--ink-2)}
.step.active{color:var(--burgundy-700);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.step.done .dot{background:var(--ok)}
.step.active .dot{background:var(--burgundy-600);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.empty{text-align:center;padding:52px 20px;color:var(--ink-3)}
.empty h3{margin-bottom:6px;color:var(--ink-2)}
.watermark{position:absolute;right:-18px;bottom:-26px;width:190px;opacity:.09;pointer-events:none}
.evidence{background:var(--sunk);border-left:3px solid var(--burgundy-600);border-radius:0 8px 8px 0;padding:11px 14px;font-size:13px;color:var(--ink-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:0}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;font-size:13px;color:var(--ink-3);cursor:pointer}
.tabs button.active{color:var(--burgundy-700);border-bottom-color:var(--burgundy-700);font-weight:600}
.toast{position:fixed;right:20px;bottom:20px;z-index:99;background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:9px;font-size:13px;box-shadow:var(--shadow-md);max-width:340px}
.toast.err{background:var(--bad);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(32,26,28,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--paper);border-radius:var(--radius-lg);max-width:520px;width:100%;box-shadow:var(--shadow-md);border:1px solid var(--line)}
svg .axis{stroke:var(--line);stroke-width:1}
svg text{font-family:var(--sans);fill:var(--ink-3)}
.net-node{cursor:pointer}
.net-edge{cursor:pointer}
.scroll-x{overflow-x:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media print{.sidebar,.topbar,.no-print{display:none!important}.page{padding:0}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>

<script>

(function(){
"use strict";
const SG = window.SG = {};

/* ---------- constants ---------- */
SG.DEFAULTS = {
  minSharedBarcodes: 3,
  minMatchingUnits: 3,
  minPartialPct: 20,
  minSeqLen: 5,
  valueThreshold: 0,
  commonBarcodePct: 40,        // barcode present in >X% of locations = "common SKU", down-weighted
  weights: { overlap:22, units:18, freq:14, qtyAlign:8, article:6, mrp:5, sequence:12, rarity:15 }
};

SG.LEVELS = [
  {min:80, key:'critical', label:'Critical Pattern'},
  {min:60, key:'high',     label:'High Suspicion'},
  {min:40, key:'moderate', label:'Moderate Suspicion'},
  {min:20, key:'low',      label:'Low Suspicion'},
  {min:0,  key:'normal',   label:'Normal'}
];
SG.levelOf = s => SG.LEVELS.find(l => s >= l.min);

SG.DETECTION = {
  exact:    'Exact Location Pattern',
  complete: 'Potential Complete Duplicate Scan',
  partial:  'Potential Partial Duplicate Scan',
  subset:   'Potential Subset Duplication',
  embedded: 'Embedded Duplicate Component',
  sequence: 'Repeated Scan Block',
  qtyMult:  'Quantity Multiple Pattern',
  cross:    'Cross-Location Barcode Overlap',
  multi:    'Potential Multi-Source Duplicate Pattern'
};

/* ---------- column synonyms ---------- */
SG.FIELDS = [
  {key:'location', label:'Location',    req:true,  syn:['location','store','store code','storecode','location code','locationcode','site','branch','outlet','loc','shop','store name','bin','section']},
  {key:'barcode',  label:'Barcode',     req:true,  syn:['barcode','bar code','ean','upc','sku','item barcode','itemcode','item code','scan','scanned barcode','product code','gtin','article barcode']},
  {key:'qty',      label:'Quantity',    req:true,  syn:['quantity','qty','count','units','pcs','pieces','scanned qty','scan qty','physical qty','nos']},
  {key:'srno',     label:'Sr. No.',     req:false, syn:['sr no','sr. no.','srno','serial','sl no','s no','sr','sno','#','slno','sr.no']},
  {key:'article',  label:'Article',     req:false, syn:['article','article code','item','item no','style','style code','material','product','art no','articleno']},
  {key:'category', label:'Category',    req:false, syn:['category','dept','department','division','section name','group','merch category','class']},
  {key:'desc',     label:'Description', req:false, syn:['description','desc','item description','product description','item name','name','article description','particulars']},
  {key:'mrp',      label:'MRP',         req:false, syn:['mrp','price','rate','unit price','selling price','retail price','mrp value','unitmrp']},
  {key:'value',    label:'Value',       req:false, syn:['value','amount','total value','net value','stock value','line value','total']},
  {key:'remarks',  label:'Remarks',     req:false, syn:['remarks','remark','comment','comments','note','notes']},
  {key:'date',     label:'Date',        req:false, syn:['date','scan date','audit date','count date','day']},
  {key:'time',     label:'Time',        req:false, syn:['time','scan time','timestamp','datetime','date time','scanned at']},
  {key:'user',     label:'User/Auditor',req:false, syn:['user','auditor','operator','counted by','scanned by','employee','staff','user name','username','supervisor']},
  {key:'scanner',  label:'Scanner ID',  req:false, syn:['scanner','scanner id','device','device id','terminal','gun','handheld','machine']},
  {key:'scanid',   label:'Scan ID',     req:false, syn:['scan id','scanid','session','session id','transaction','txn id','record id']}
];

/* ---------- helpers ---------- */
const clean = s => String(s == null ? '' : s).replace(/\s+/g,' ').trim();
const key = s => clean(s).toLowerCase().replace(/[^a-z0-9 .#]/g,'').replace(/\s+/g,' ').trim();
SG.clean = clean;

SG.fmtInt = n => (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString('en-IN');
SG.fmtMoney = n => (n == null || isNaN(n)) ? '—' : '₹' + Math.round(n).toLocaleString('en-IN');
SG.fmtPct = n => (n == null || isNaN(n)) ? '—' : (Math.round(n * 10) / 10) + '%';

/* Barcode normalisation: string always, leading zeros kept, sci-notation expanded */
SG.normBarcode = function(v){
  if (v == null) return '';
  if (typeof v === 'number'){
    if (!isFinite(v)) return '';
    return Number.isInteger(v) ? v.toFixed(0) : String(v);
  }
  let s = String(v).trim().replace(/[\u200B-\u200D\uFEFF]/g,'');
  if (/^[-+]?\d+(\.\d+)?[eE][-+]?\d+$/.test(s)){
    const n = Number(s);
    if (isFinite(n) && Math.abs(n) < 1e21) s = n.toFixed(0);
  }
  s = s.replace(/\s+/g,'');
  if (/^\d+\.0+$/.test(s)) s = s.split('.')[0];
  return s;
};
SG.normLocation = v => clean(v);
SG.locKey = v => clean(v).toUpperCase().replace(/[\s_\-]+/g,'-');

SG.toNum = function(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  const s = String(v).replace(/[₹,\s]/g,'').replace(/[^\d.\-]/g,'');
  if (s === '' || s === '-' || s === '.') return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
};

/* ---------- column auto-detection ---------- */
SG.detectColumns = function(headers){
  const map = {}; const used = new Set();
  const hk = headers.map(h => key(h));
  SG.FIELDS.forEach(f => {
    let best = -1, bestScore = 0;
    hk.forEach((h, i) => {
      if (!h || used.has(i)) return;
      let score = 0;
      if (f.syn.includes(h)) score = 100;
      else if (f.syn.some(s => h === s.replace(/\s/g,''))) score = 95;
      else if (f.syn.some(s => s.length > 2 && h.includes(s))) score = 70;
      else if (f.syn.some(s => s.length > 3 && s.includes(h) && h.length > 2)) score = 55;
      if (score > bestScore){ bestScore = score; best = i; }
    });
    if (best >= 0 && bestScore >= 55){ map[f.key] = best; used.add(best); }
  });
  return map;
};

/* ---------- dataset build ---------- */
SG.buildDataset = function(rows, headers, map, headerRowIndex){
  const recs = [];
  const at = (r, k) => (map[k] == null ? null : r[map[k]]);
  for (let i = 0; i < rows.length; i++){
    const r = rows[i];
    if (!r || r.every(c => c == null || String(c).trim() === '')) continue;
    const loc = SG.normLocation(at(r,'location'));
    const bc  = SG.normBarcode(at(r,'barcode'));
    let qty   = SG.toNum(at(r,'qty'));
    const mrp = SG.toNum(at(r,'mrp'));
    let val   = SG.toNum(at(r,'value'));
    if (qty == null && bc) qty = 1;
    if (val == null && qty != null && mrp != null) val = qty * mrp;
    recs.push({
      i: recs.length,
      row: headerRowIndex + 2 + i,          // original Excel row number
      loc, lk: SG.locKey(loc), bc,
      qty: qty == null ? 0 : qty,
      rawQty: at(r,'qty'),
      article: clean(at(r,'article')),
      category: clean(at(r,'category')),
      desc: clean(at(r,'desc')),
      mrp: mrp, value: val,
      srno: at(r,'srno') == null ? '' : clean(at(r,'srno')),
      remarks: clean(at(r,'remarks')),
      date: clean(at(r,'date')), time: clean(at(r,'time')),
      user: clean(at(r,'user')), scanner: clean(at(r,'scanner')), scanid: clean(at(r,'scanid')),
      rawBarcode: at(r,'barcode')
    });
  }
  return recs;
};

/* ---------- data quality ---------- */
SG.dataQuality = function(recs){
  const issues = [];
  const add = (type, severity, rowsArr, detail) => {
    if (!rowsArr.length) return;
    issues.push({ type, severity, count: rowsArr.length, rows: rowsArr.slice(0, 200), detail });
  };
  const blankLoc = [], blankBc = [], blankQty = [], badQty = [], negQty = [], sci = [], badFmt = [];
  const srSeen = new Map(), dupSr = [];
  const rowSeen = new Map(), dupRows = [];
  const bcArticles = new Map(), bcMrp = new Map(), artBc = new Map();
  const locVariants = new Map();

  recs.forEach(r => {
    if (!r.loc) blankLoc.push(r);
    if (!r.bc) blankBc.push(r);
    if (r.rawQty == null || String(r.rawQty).trim() === '') blankQty.push(r);
    else if (SG.toNum(r.rawQty) == null) badQty.push(r);
    else if (r.qty < 0) negQty.push(r);
    if (r.rawBarcode != null && /e\+/i.test(String(r.rawBarcode))) sci.push(r);
    if (r.bc && !/^[0-9]+$/.test(r.bc)) badFmt.push(r);

    if (r.srno){
      const k = r.srno;
      if (srSeen.has(k)) dupSr.push(r); else srSeen.set(k, r.row);
    }
    const sig = r.lk + '|' + r.bc + '|' + r.qty + '|' + (r.article || '');
    if (rowSeen.has(sig)) dupRows.push(r); else rowSeen.set(sig, r.row);

    if (r.bc){
      if (r.article){
        if (!bcArticles.has(r.bc)) bcArticles.set(r.bc, new Set());
        bcArticles.get(r.bc).add(r.article);
        if (!artBc.has(r.article)) artBc.set(r.article, new Set());
        artBc.get(r.article).add(r.bc);
      }
      if (r.mrp != null){
        if (!bcMrp.has(r.bc)) bcMrp.set(r.bc, new Set());
        bcMrp.get(r.bc).add(Math.round(r.mrp * 100) / 100);
      }
    }
    if (r.loc){
      if (!locVariants.has(r.lk)) locVariants.set(r.lk, new Set());
      locVariants.get(r.lk).add(r.loc);
    }
  });

  add('Blank location', 'high', blankLoc, 'Rows without a location cannot be attributed to a site.');
  add('Blank barcode', 'high', blankBc, 'Rows without a barcode are excluded from duplication analysis.');
  add('Blank quantity', 'medium', blankQty, 'Quantity treated as 1 where blank.');
  add('Invalid quantity', 'high', badQty, 'Quantity could not be read as a number.');
  add('Negative quantity', 'high', negQty, 'Negative counts usually indicate a correction entry.');
  add('Barcode stored as scientific notation', 'high', sci, 'Excel converted long barcodes to 8.90594E+12 — original digits may be lost at source.');
  add('Non-numeric barcode format', 'low', badFmt, 'Barcode contains characters other than digits.');
  add('Duplicate Sr. No.', 'medium', dupSr, 'The same serial number appears on more than one row.');
  add('Identical duplicate rows', 'medium', dupRows, 'Same location + barcode + quantity + article repeated — may be a re-scan of the same line.');

  const multiArt = [];
  bcArticles.forEach((set, bc) => { if (set.size > 1) multiArt.push({ bc, values: [...set] }); });
  const multiMrp = [];
  bcMrp.forEach((set, bc) => { if (set.size > 1) multiMrp.push({ bc, values: [...set] }); });
  const multiBc = [];
  artBc.forEach((set, a) => { if (set.size > 1) multiBc.push({ article: a, values: [...set] }); });
  const locInc = [];
  locVariants.forEach((set, lk) => { if (set.size > 1) locInc.push({ lk, values: [...set] }); });

  const addMaster = (type, arr, detail) => {
    if (arr.length) issues.push({ type, severity:'master', count: arr.length, master: arr.slice(0,200), detail });
  };
  addMaster('Same barcode, multiple articles', multiArt, 'Master-data inconsistency — not treated as a duplicate scan.');
  addMaster('Same barcode, different MRP', multiMrp, 'MRP differs between rows for one barcode; value at risk uses the highest observed MRP.');
  addMaster('Same article, multiple barcodes', multiBc, 'Common with re-barcoded stock — informational only.');
  addMaster('Location naming inconsistency', locInc, 'These spellings were merged into one location for analysis.');

  return issues;
};

/* ---------- location signatures ---------- */
SG.buildSignatures = function(recs){
  const locs = new Map();
  recs.forEach(r => {
    if (!r.loc || !r.bc) return;
    let L = locs.get(r.lk);
    if (!L){
      L = { lk:r.lk, name:r.loc, rows:0, units:0, qty:new Map(), freq:new Map(), seq:[], seqRows:[],
            value:0, mrp:new Map(), article:new Map(), category:new Map(), firstRow:r.row, lastRow:r.row,
            users:new Set(), scanners:new Set(), dates:new Set() };
      locs.set(r.lk, L);
    }
    const q = r.qty > 0 ? r.qty : 0;
    L.rows++; L.units += q;
    L.qty.set(r.bc, (L.qty.get(r.bc) || 0) + q);
    L.freq.set(r.bc, (L.freq.get(r.bc) || 0) + 1);
    L.seq.push(r.bc); L.seqRows.push(r.row);
    L.value += (r.value != null ? r.value : (r.mrp != null ? r.mrp * q : 0));
    if (r.mrp != null) L.mrp.set(r.bc, Math.max(L.mrp.get(r.bc) || 0, r.mrp));
    if (r.article) L.article.set(r.bc, r.article);
    if (r.category) L.category.set(r.category, (L.category.get(r.category) || 0) + q);
    if (r.user) L.users.add(r.user);
    if (r.scanner) L.scanners.add(r.scanner);
    if (r.date) L.dates.add(r.date);
    L.firstRow = Math.min(L.firstRow, r.row); L.lastRow = Math.max(L.lastRow, r.row);
  });
  locs.forEach(L => {
    L.uniq = L.qty.size;
    L.repeatedBarcodes = [...L.freq.values()].filter(v => v > 1).length;
    L.avgQty = L.uniq ? L.units / L.uniq : 0;
  });
  return locs;
};

/* ---------- barcode index ---------- */
SG.buildBarcodeIndex = function(recs){
  const idx = new Map();
  recs.forEach(r => {
    if (!r.bc || !r.loc) return;
    let B = idx.get(r.bc);
    if (!B){ B = { bc:r.bc, total:0, rows:0, locs:new Map(), article:'', desc:'', category:'', mrp:null }; idx.set(r.bc, B); }
    B.total += r.qty; B.rows++;
    if (!B.article && r.article) B.article = r.article;
    if (!B.desc && r.desc) B.desc = r.desc;
    if (!B.category && r.category) B.category = r.category;
    if (r.mrp != null) B.mrp = Math.max(B.mrp == null ? 0 : B.mrp, r.mrp);
    let L = B.locs.get(r.lk);
    if (!L){ L = { lk:r.lk, name:r.loc, qty:0, rows:[] }; B.locs.set(r.lk, L); }
    L.qty += r.qty; if (L.rows.length < 60) L.rows.push(r.row);
  });
  return idx;
};

/* ---------- longest common contiguous scan block ---------- */
function longestRun(seqA, seqB, budget){
  const posB = new Map();
  for (let j = 0; j < seqB.length; j++){
    let a = posB.get(seqB[j]); if (!a){ a = []; posB.set(seqB[j], a); } a.push(j);
  }
  let prev = new Map(), best = 0, bestI = -1, bestJ = -1, work = 0;
  for (let i = 0; i < seqA.length; i++){
    const list = posB.get(seqA[i]);
    const cur = new Map();
    if (list){
      work += list.length;
      for (let x = 0; x < list.length; x++){
        const j = list[x];
        const r = (prev.get(j - 1) || 0) + 1;
        cur.set(j, r);
        if (r > best){ best = r; bestI = i; bestJ = j; }
      }
    }
    prev = cur;
    if (work > budget) break;
  }
  return { len:best, aEnd:bestI, bEnd:bestJ };
}

/* ---------- pair analysis ---------- */
function analysePair(A, B, ctx){
  const cfg = ctx.cfg, W = cfg.weights, nLoc = ctx.nLoc;
  const small = A.uniq <= B.uniq ? A : B;
  const other = small === A ? B : A;

  const shared = [];
  let matchingUnits = 0, qtyGap = 0, freqMatch = 0, artMatch = 0, artCmp = 0,
      mrpMatch = 0, mrpCmp = 0, rarity = 0, multiples = 0, valueRisk = 0, combined = 0;

  small.qty.forEach((qs, bc) => {
    if (!other.qty.has(bc)) return;
    const qa = A.qty.get(bc), qb = B.qty.get(bc);
    const common = Math.min(qa, qb), diff = Math.abs(qa - qb);
    const spread = ctx.spread.get(bc) || 1;
    const mrp = Math.max(A.mrp.get(bc) || 0, B.mrp.get(bc) || 0) || null;
    const fa = A.freq.get(bc), fb = B.freq.get(bc);
    matchingUnits += common; qtyGap += diff; combined += qa + qb;
    if (fa === fb && qa === qb) freqMatch++;
    const aArt = A.article.get(bc), bArt = B.article.get(bc);
    if (aArt && bArt){ artCmp++; if (aArt === bArt) artMatch++; }
    const aM = A.mrp.get(bc), bM = B.mrp.get(bc);
    if (aM && bM){ mrpCmp++; if (Math.abs(aM - bM) < 0.01) mrpMatch++; }
    rarity += Math.min(1, 2 / spread);
    if (qa !== qb && qa > 0 && qb > 0 && (Math.max(qa,qb) % Math.min(qa,qb) === 0)) multiples++;
    if (mrp) valueRisk += common * mrp;
    shared.push({ bc, qa, qb, common, diff, fa, fb, mrp,
      article: aArt || bArt || '', spread,
      value: mrp ? common * mrp : null });
  });

  const nShared = shared.length;
  if (!nShared) return null;
  rarity = rarity / nShared;

  const aToB = A.units ? matchingUnits / A.units * 100 : 0;
  const bToA = B.units ? matchingUnits / B.units * 100 : 0;
  const containment = nShared / Math.min(A.uniq, B.uniq) * 100;
  const jaccard = nShared / (A.uniq + B.uniq - nShared) * 100;
  const freqRatio = freqMatch / nShared;

  // sequence evidence
  let seq = { len:0 };
  if (nShared >= 2 && A.seq.length * 1 + B.seq.length < 400000){
    const r = longestRun(A.seq, B.seq, 3000000);
    if (r.len >= 3){
      const aS = r.aEnd - r.len + 1, bS = r.bEnd - r.len + 1;
      seq = { len:r.len, aFrom:A.seqRows[aS], aTo:A.seqRows[r.aEnd], bFrom:B.seqRows[bS], bTo:B.seqRows[r.bEnd],
              barcodes:A.seq.slice(aS, r.aEnd + 1) };
    }
  }
  const seqSet = new Set(seq.len ? seq.barcodes : []);

  // weighted score over available factors
  const f = [];
  f.push([W.overlap, containment / 100]);
  f.push([W.units, Math.max(aToB, bToA) / 100]);
  f.push([W.freq, freqRatio]);
  f.push([W.qtyAlign, matchingUnits / (matchingUnits + qtyGap || 1)]);
  if (artCmp) f.push([W.article, artMatch / artCmp]);
  if (mrpCmp) f.push([W.mrp, mrpMatch / mrpCmp]);
  f.push([W.sequence, Math.min(1, seq.len / Math.max(3, cfg.minSeqLen * 1.6))]);
  f.push([W.rarity, rarity]);
  let wSum = 0, sSum = 0;
  f.forEach(([w, v]) => { wSum += w; sSum += w * Math.max(0, Math.min(1, v)); });
  let score = wSum ? sSum / wSum * 100 : 0;

  // confidence damping — a single shared line is never strong evidence
  const conf = Math.min(1, nShared / Math.max(3, cfg.minSharedBarcodes * 2));
  score *= (0.58 + 0.42 * conf);
  // commonality gate — popular SKUs across many stores must not carry the score
  score *= (0.45 + 0.55 * rarity);
  score = Math.max(0, Math.min(100, score));

  // detection typing
  const types = [];
  const exactSig = containment >= 99.9 && freqRatio >= 0.999 && A.uniq === B.uniq && A.units === B.units;
  if (exactSig) types.push('exact');
  if (!exactSig && aToB >= 90 && bToA >= 90) types.push('complete');
  const smallIsA = A.units <= B.units;
  const bigPct = smallIsA ? aToB : bToA;
  const smallLoc = smallIsA ? A : B, bigLoc = smallIsA ? B : A;
  // a subset is a near-whole containment of the smaller signature; anything less is partial
  if (!exactSig && bigPct >= 85 && containment >= 95 && bigLoc.units >= smallLoc.units * 1.6) types.push('subset');
  if (!exactSig && Math.max(aToB,bToA) >= cfg.minPartialPct && Math.min(aToB,bToA) < 90 &&
      (A.units - matchingUnits > 0 || B.units - matchingUnits > 0)) types.push('partial');
  if (matchingUnits >= cfg.minMatchingUnits && (A.units - matchingUnits > 0) && (B.units - matchingUnits > 0) &&
      Math.max(aToB,bToA) >= cfg.minPartialPct) types.push('embedded');
  if (seq.len >= cfg.minSeqLen) types.push('sequence');
  const qtyMultDominant = multiples >= 2 && multiples / nShared >= 0.6 && freqRatio < 0.5;
  if (multiples >= 2 && multiples / nShared >= 0.4) types.push('qtyMult');
  if (!types.length) types.push('cross');

  // the repeated block leads when it explains the whole overlap and neither location is mostly matched
  const seqDominant = seq.len >= cfg.minSeqLen && seq.len >= nShared * 0.8 && Math.max(aToB, bToA) < 85;
  const order = ['exact','complete','subset'];
  if (qtyMultDominant) order.push('qtyMult');
  if (seqDominant) order.push('sequence');
  order.push('partial','qtyMult','sequence','embedded','cross');
  const primary = order.find(t => types.includes(t));

  // evidence level
  let evidence = 1;
  if (nShared >= 2) evidence = 2;
  if (nShared >= 2 && freqMatch >= 2) evidence = 3;
  if (Math.max(aToB, bToA) >= 50 || nShared >= 8) evidence = Math.max(evidence, 4);
  if (containment >= 99.9 && freqRatio >= 0.999) evidence = Math.max(evidence, 5);
  if (evidence >= 5 && seq.len >= cfg.minSeqLen) evidence = 6;

  shared.forEach(s => {
    s.seqMatch = seqSet.has(s.bc);
    s.status = s.qa === s.qb ? (s.fa === s.fb ? 'EXACT MATCH' : 'PARTIAL MATCH')
             : (Math.max(s.qa,s.qb) % Math.min(s.qa,s.qb) === 0 ? 'QUANTITY MULTIPLE' : 'QUANTITY DIFFERENCE');
  });
  shared.sort((x,y) => y.common - x.common || y.value - x.value);

  return {
    id: A.lk + '::' + B.lk, aKey:A.lk, bKey:B.lk, a:A.name, b:B.name,
    aUnits:A.units, bUnits:B.units, aUniq:A.uniq, bUniq:B.uniq, aRows:A.rows, bRows:B.rows,
    aValue:A.value, bValue:B.value,
    matchingBarcodes:nShared, matchingUnits, aToB, bToA, containment, jaccard,
    freqMatch, freqRatio, qtyGap, rarity, multiples, valueRisk, combinedExposure:combined,
    aUnique:A.units - matchingUnits, bUnique:B.units - matchingUnits,
    aUniqueBarcodes:A.uniq - nShared, bUniqueBarcodes:B.uniq - nShared,
    score:Math.round(score), level:SG.levelOf(Math.round(score)), types, primary, evidence, seq, shared,
    users:[...new Set([...A.users].filter(u => B.users.has(u)))],
    scanners:[...new Set([...A.scanners].filter(u => B.scanners.has(u)))],
    dates:[...new Set([...A.dates].filter(u => B.dates.has(u)))]
  };
}

/* ---------- why flagged ---------- */
SG.why = function(p){
  const bits = [];
  if (p.types.includes('exact'))
    bits.push(`all ${p.matchingBarcodes} unique barcodes match, every barcode frequency and quantity is identical, and both locations hold exactly ${SG.fmtInt(p.aUnits)} units`);
  else if (p.types.includes('complete'))
    bits.push(`${SG.fmtInt(p.matchingUnits)} of ${SG.fmtInt(p.aUnits)} units at ${p.a} and ${SG.fmtInt(p.bUnits)} units at ${p.b} correspond across ${p.matchingBarcodes} shared barcodes`);
  else if (p.types.includes('subset'))
    bits.push(`${SG.fmtInt(p.matchingUnits)} units of the smaller location appear identically inside the larger one (${SG.fmtPct(Math.max(p.aToB,p.bToA))} of it), while the larger location holds additional unmatched stock`);
  else
    bits.push(`${p.matchingBarcodes} barcodes are shared, accounting for ${SG.fmtInt(p.matchingUnits)} units — ${SG.fmtPct(p.aToB)} of ${p.a} and ${SG.fmtPct(p.bToA)} of ${p.b}`);
  if (p.freqMatch && !p.types.includes('exact'))
    bits.push(`${p.freqMatch} of ${p.matchingBarcodes} shared barcodes carry an identical scan frequency and quantity`);
  if (p.seq.len >= 3)
    bits.push(`a run of ${p.seq.len} records repeats in the same scan order (rows ${p.seq.aFrom}–${p.seq.aTo} against rows ${p.seq.bFrom}–${p.seq.bTo})`);
  if (p.multiples >= 2)
    bits.push(`${p.multiples} barcodes show exact quantity multiples, consistent with a repeated count plus additional stock`);
  if (p.rarity > 0.75)
    bits.push(`the shared barcodes are rare across the file, so ordinary SKU overlap does not explain the match`);
  else if (p.rarity < 0.4)
    bits.push(`several shared barcodes are widely stocked, which reduces the weight of this pattern`);
  if (p.aUnique > 0 || p.bUnique > 0)
    bits.push(`${SG.fmtInt(p.aUnique)} units at ${p.a} and ${SG.fmtInt(p.bUnique)} units at ${p.b} remain unmatched`);
  if (p.scanners.length) bits.push(`both locations were scanned on device ${p.scanners.slice(0,2).join(', ')}`);
  else if (p.users.length) bits.push(`both locations were counted by ${p.users.slice(0,2).join(', ')}`);
  return 'This pair was flagged because ' + bits.join('; ') + '.';
};

/* ---------- main analysis ---------- */
SG.analyse = async function(recs, cfg, onProgress){
  const step = async (label, pct) => { if (onProgress) onProgress(label, pct); await new Promise(r => setTimeout(r, 0)); };

  await step('Normalising records', 8);
  const usable = recs.filter(r => r.loc && r.bc);

  await step('Building barcode index', 18);
  const bcIndex = SG.buildBarcodeIndex(usable);

  await step('Building location signatures', 30);
  const locs = SG.buildSignatures(usable);
  const nLoc = locs.size;
  const spread = new Map();
  bcIndex.forEach((B, bc) => spread.set(bc, B.locs.size));

  await step('Generating candidate pairs', 42);
  const commonCut = Math.max(3, Math.ceil(nLoc * cfg.commonBarcodePct / 100));
  const cand = new Map();
  bcIndex.forEach(B => {
    const n = B.locs.size;
    if (n < 2) return;
    if (n > commonCut && n > 6) return;                 // ubiquitous SKU — not a pairing signal
    if (n > 80) return;                                  // guard against quadratic blow-up
    const ks = [...B.locs.keys()];
    for (let i = 0; i < ks.length; i++)
      for (let j = i + 1; j < ks.length; j++){
        const id = ks[i] < ks[j] ? ks[i] + '::' + ks[j] : ks[j] + '::' + ks[i];
        cand.set(id, (cand.get(id) || 0) + 1);
      }
  });

  await step('Running duplication analysis', 55);
  const ctx = { cfg, spread, nLoc };
  const pairs = [];
  let done = 0;
  const entries = [...cand.entries()].filter(([, c]) => c >= Math.max(1, Math.min(cfg.minSharedBarcodes, 2)));
  for (const [id] of entries){
    const [ak, bk] = id.split('::');
    const A = locs.get(ak), B = locs.get(bk);
    if (!A || !B) continue;
    const p = analysePair(A, B, ctx);
    if (p) pairs.push(p);
    if (++done % 400 === 0) await step('Running duplication analysis', 55 + Math.min(20, done / entries.length * 20));
  }

  await step('Analysing scan sequences and quantities', 78);
  const flagged = pairs.filter(p =>
    (p.matchingBarcodes >= cfg.minSharedBarcodes || p.seq.len >= cfg.minSeqLen || p.types.includes('exact')) &&
    p.matchingUnits >= cfg.minMatchingUnits &&
    (Math.max(p.aToB, p.bToA) >= cfg.minPartialPct || p.seq.len >= cfg.minSeqLen || p.types.includes('exact')) &&
    p.score >= 20 &&
    (!cfg.valueThreshold || p.valueRisk >= cfg.valueThreshold)
  );
  flagged.sort((x, y) => y.score - x.score || y.matchingUnits - x.matchingUnits);

  await step('Mapping duplication network', 86);
  const byLoc = new Map();
  flagged.forEach(p => {
    [[p.aKey, p.bKey], [p.bKey, p.aKey]].forEach(([k]) => {
      if (!byLoc.has(k)) byLoc.set(k, []);
      byLoc.get(k).push(p);
    });
  });

  // duplicated component per location (union across its flagged pairs, capped by own quantity)
  const composition = [];
  locs.forEach(L => {
    const ps = (byLoc.get(L.lk) || []).slice().sort((x, y) => y.matchingUnits - x.matchingUnits);
    const claimed = new Map(); let dup = 0;
    const sources = [];
    ps.forEach(p => {
      const isA = p.aKey === L.lk;
      let inc = 0;
      p.shared.forEach(s => {
        const own = L.qty.get(s.bc) || 0;
        const already = claimed.get(s.bc) || 0;
        const take = Math.max(0, Math.min(s.common, own - already));
        if (take > 0){ claimed.set(s.bc, already + take); inc += take; }
      });
      if (inc > 0){
        dup += inc;
        sources.push({ pair:p, other:isA ? p.b : p.a, otherKey:isA ? p.bKey : p.aKey, units:inc, score:p.score });
      }
    });
    let dupValue = 0;
    claimed.forEach((q, bc) => { const m = L.mrp.get(bc); if (m) dupValue += q * m; });
    composition.push({
      lk:L.lk, name:L.name, units:L.units, rows:L.rows, uniq:L.uniq, value:L.value,
      dupUnits:Math.min(dup, L.units), dupValue,
      genuine:Math.max(0, L.units - dup),
      dupPct:L.units ? Math.min(100, dup / L.units * 100) : 0,
      relations:ps.length, sources,
      top:ps[0] || null, maxScore:ps.length ? Math.max(...ps.map(p => p.score)) : 0
    });
  });
  composition.sort((a, b) => b.dupUnits - a.dupUnits || b.maxScore - a.maxScore);

  // multi-source patterns
  const multiSource = composition.filter(c => {
    const strong = c.sources.filter(s => s.units >= Math.max(3, cfg.minMatchingUnits));
    return strong.length >= 2 && c.dupPct >= 25;
  }).map(c => ({
    lk:c.lk, name:c.name, units:c.units, dupUnits:c.dupUnits, dupPct:c.dupPct,
    sources:c.sources.filter(s => s.units >= Math.max(3, cfg.minMatchingUnits))
             .sort((a, b) => b.units - a.units)
  })).sort((a, b) => b.dupUnits - a.dupUnits);

  const msKeys = new Set(multiSource.map(m => m.lk));
  flagged.forEach(p => {
    if (msKeys.has(p.aKey) || msKeys.has(p.bKey)){
      if (!p.types.includes('multi')) p.types.push('multi');
      if (p.evidence >= 4) p.evidence = 7;
    }
    p.whyFlagged = SG.why(p);
  });

  await step('Calculating risk and preparing results', 95);
  const counts = { critical:0, high:0, moderate:0, low:0, normal:0 };
  flagged.forEach(p => counts[p.level.key]++);
  const flaggedLocs = new Set();
  flagged.forEach(p => { flaggedLocs.add(p.aKey); flaggedLocs.add(p.bKey); });

  const totals = {
    locations: nLoc,
    rows: recs.length,
    usableRows: usable.length,
    units: [...locs.values()].reduce((s, L) => s + L.units, 0),
    uniqueBarcodes: bcIndex.size,
    value: [...locs.values()].reduce((s, L) => s + L.value, 0),
    flaggedLocations: flaggedLocs.size,
    pairs: flagged.length,
    counts,
    dupUnits: composition.reduce((s, c) => s + c.dupUnits, 0),
    dupValue: composition.reduce((s, c) => s + c.dupValue, 0),
    sequences: flagged.filter(p => p.seq.len >= cfg.minSeqLen).length
  };

  await step('Complete', 100);
  return { pairs:flagged, allPairs:pairs, locs, bcIndex, composition, multiSource, totals, byLoc, cfg, spread };
};

/* ---------- physical verification script ---------- */
SG.verificationSteps = p => ([
  `Physically re-count the ${p.matchingBarcodes} matching barcodes at ${p.a} (${SG.fmtInt(p.matchingUnits)} units at risk).`,
  `Physically re-count the same barcode set at ${p.b}.`,
  'Compare serial numbers, price tags or other physical identifiers on the matching pieces.',
  'Confirm whether the same physical pieces were counted at both locations.',
  p.scanners.length || p.users.length || p.dates.length
    ? `Review the scan log for ${[p.scanners.length ? 'device ' + p.scanners.slice(0,2).join('/') : '', p.users.length ? 'auditor ' + p.users.slice(0,2).join('/') : '', p.dates.length ? 'date ' + p.dates.slice(0,2).join('/') : ''].filter(Boolean).join(', ')}.`
    : 'Review scan timestamps, auditor and scanner details at source if the audit system records them.'
]);
})();
</script>

(function(){

const SG = window.SG;

/* ---------------- reading workbooks ---------------- */
SG.readFile = function(file){
  return new Promise((resolve, reject) => {
    const name = (file.name || '').toLowerCase();
    const ext = name.split('.').pop();
    if (!['xlsx','xls','csv','xlsm','txt','tsv'].includes(ext))
      return reject(new Error('That file type is not supported. Upload an .xlsx, .xls or .csv audit file.'));
    if (file.size === 0) return reject(new Error('That file is empty. Upload the audit file that contains the scan rows.'));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('The file could not be read. Try re-saving it from Excel and uploading again.'));
    fr.onload = e => {
      try {
        if (ext === 'csv' || ext === 'txt' || ext === 'tsv'){
          const text = new TextDecoder('utf-8').decode(new Uint8Array(e.target.result));
          const out = Papa.parse(text, { skipEmptyLines:'greedy' });
          if (!out.data.length) return reject(new Error('No rows were found in that file.'));
          resolve({ sheets:['Sheet1'], data:{ Sheet1: out.data }, name:file.name, size:file.size });
        } else {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', cellDates:true, raw:false, cellNF:false });
          if (!wb.SheetNames.length) return reject(new Error('That workbook has no sheets.'));
          const data = {};
          wb.SheetNames.forEach(n => {
            data[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:true, defval:null, blankrows:false });
          });
          resolve({ sheets:wb.SheetNames, data, name:file.name, size:file.size });
        }
      } catch (err){
        reject(new Error('The workbook could not be opened — it may be corrupt or password protected.'));
      }
    };
    fr.readAsArrayBuffer(file);
  });
};

/* paste from clipboard — Excel copies as tab-separated text; plain CSV paste is comma/semicolon */
SG.parsePastedTable = function(text){
  const raw = String(text == null ? '' : text);
  if (!raw.trim())
    throw new Error('Nothing was pasted. In Excel, select your data including the header row, copy it, then paste it here.');
  const firstLine = raw.split(/\r\n|\r|\n/).find(l => l.trim() !== '') || '';
  const delimiter = firstLine.includes('\t') ? '\t' : '';   // force tab when present; else let Papa auto-detect
  const out = Papa.parse(raw, { delimiter, skipEmptyLines:'greedy' });
  if (!out.data.length || out.data.length < 2 || out.data[0].length < 2)
    throw new Error('That does not look like a table with more than one column and one row. Make sure the header row was included in the copy.');
  return { sheets:['Pasted Data'], data:{ 'Pasted Data': out.data }, name:'Pasted table', size:out.data.length, pasted:true };
};

/* find the header row: first row with >=2 non-empty cells that maps to at least one known field */
SG.findHeaderRow = function(grid){
  const limit = Math.min(grid.length, 12);
  let best = 0, bestScore = -1;
  for (let i = 0; i < limit; i++){
    const row = (grid[i] || []).map(c => SG.clean(c));
    const filled = row.filter(Boolean).length;
    if (filled < 2) continue;
    const m = SG.detectColumns(row);
    const score = Object.keys(m).length * 10 + filled;
    if (score > bestScore){ bestScore = score; best = i; }
  }
  return best;
};

/* ---------------- demo dataset ---------------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

SG.demoData = function(){
  const r = rng(20260917);
  const cats = ['Menswear','Womenswear','Kidswear','Footwear','Home & Living','Accessories','Innerwear','Luggage'];
  const nouns = { Menswear:['Slim Fit Shirt','Chino Trouser','Polo T-Shirt','Denim Jacket','Formal Blazer'],
    Womenswear:['Rayon Kurta','A-Line Dress','Palazzo Pant','Printed Saree','Knit Top'],
    Kidswear:['Cotton Romper','Graphic Tee','School Shorts','Fleece Hoodie','Party Frock'],
    Footwear:['Running Shoe','Leather Loafer','Kolhapuri Chappal','Canvas Sneaker','Block Heel'],
    'Home & Living':['Cotton Bedsheet','Terry Towel','Cushion Cover','Table Runner','Door Mat'],
    Accessories:['Leather Belt','Analog Watch','Sunglasses','Silk Scarf','Cap'],
    Innerwear:['Vest Pack','Boxer Brief','Camisole','Thermal Set','Sports Bra'],
    Luggage:['Cabin Trolley','Laptop Backpack','Duffel Bag','Sling Bag','Travel Pouch'] };
  const colors = ['Navy','Maroon','Olive','Ivory','Charcoal','Rust','Teal','Beige'];
  const sizes = ['S','M','L','XL','XXL','28','30','32','7','8','9','Free'];

  const cat = [];
  for (let i = 0; i < 3200; i++){
    const c = cats[Math.floor(r() * cats.length)];
    const n = nouns[c][Math.floor(r() * nouns[c].length)];
    cat.push({
      bc: '890' + String(5000000000 + Math.floor(r() * 4999999999)).slice(0,10),
      article: 'ART-' + (10000 + Math.floor(r() * 89999)),
      category: c,
      desc: `${colors[Math.floor(r()*colors.length)]} ${n} · ${sizes[Math.floor(r()*sizes.length)]}`,
      mrp: [199,299,349,499,599,699,799,999,1299,1499,1999,2499,2999,3499][Math.floor(r()*14)]
    });
  }
  const popular = cat.slice(0, 6);   // widely stocked SKUs — the false-positive control test
  const pool = cat.slice(6);

  const rows = [];
  const users = ['R. Iyer','S. Banerjee','M. Qureshi','A. Deshpande','K. Nair','P. Chauhan'];
  const scanners = ['SCN-114','SCN-220','SCN-331','SCN-407','SCN-512'];
  let sr = 0;
  const day = i => '0' + (2 + Math.floor(i / 9)) + '-06-2026';
  const clock = (h, m) => String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');

  let locIdx = 0;
  const locName = () => 'PTS-Q2-' + (3400 + (locIdx++));
  const push = (loc, item, qty, meta) => {
    rows.push({ 'Sr. No.': ++sr, 'Location':loc, 'Barcode':item.bc, 'Article':item.article,
      'Category':item.category, 'Description':item.desc, 'MRP':item.mrp, 'Quantity':qty,
      'Value':+(item.mrp * qty).toFixed(2), 'Date':meta.d, 'Time':meta.t, 'User':meta.u, 'Scanner ID':meta.s,
      'Remarks':'' });
  };
  const metaFor = (i, hour) => ({ d:day(i), t:clock(hour, Math.floor(r()*60)),
    u:users[Math.floor(r()*users.length)], s:scanners[Math.floor(r()*scanners.length)] });
  // every location draws a disjoint slice of the catalogue, so the only cross-location
  // overlap in the demo file is the overlap this generator plants deliberately
  for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  let cursor = 0;
  const pick = n => pool.slice(cursor, cursor += n);
  const shuffled = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };

  const stores = [], ordinary = [];

  // --- CASE 1: exact duplicate — 14 barcodes / 17 units, reproduced line for line
  const c1 = pick(14), c1q = [1,1,2,1,1,1,2,1,1,1,1,2,1,1];   // 14 barcodes, 17 units
  const L1a = locName(), L1b = locName();
  const m1 = metaFor(1, 9);
  c1.forEach((it, i) => push(L1a, it, c1q[i], m1));
  stores.push(L1a);

  // --- 8 ordinary stores in between
  for (let s = 0; s < 8; s++){
    const L = locName(); stores.push(L); ordinary.push(L);
    const items = pick(18 + Math.floor(r() * 30)); const m = metaFor(s, 10 + (s % 7));
    items.forEach(it => push(L, it, 1 + Math.floor(r() * 3), m));
    shuffled(popular).slice(0, 2 + Math.floor(r()*3)).forEach(it => push(L, it, 1 + Math.floor(r()*4), m));
  }

  const m1b = metaFor(4, 15);
  c1.forEach((it, i) => push(L1b, it, c1q[i], { ...m1b, s:m1.s }));   // same scanner, later day
  stores.push(L1b);

  // --- CASE 2: partial duplicate — A = 50 units, B = 120 units, 45 units shared
  const L2a = locName(), L2b = locName();
  const a2 = pick(30);
  const q2 = a2.map((_, i) => (i < 20 ? 2 : 1));                  // 20*2 + 10*1 = 50 units
  const m2a = metaFor(6, 11); a2.forEach((it, i) => push(L2a, it, q2[i], m2a));
  const m2b = metaFor(9, 16);
  let carried = 0, idx = 0;
  while (carried < 45 && idx < a2.length){                        // reproduce 45 of A's units
    const take = Math.min(q2[idx], 45 - carried);
    push(L2b, a2[idx], take, m2b); carried += take; idx++;
  }
  const b2 = pick(40); let extra = 0;                             // plus 75 genuine units
  b2.forEach(it => { if (extra >= 75) return; const q = Math.min(2, 75 - extra); push(L2b, it, q, m2b); extra += q; });
  stores.push(L2a, L2b);

  // --- CASE 3: subset — A = 20 units in 18 barcodes, 18 of them inside a 100-unit location
  const L3a = locName(), L3b = locName();
  const a3 = pick(18), q3 = a3.map((_, i) => (i < 2 ? 2 : 1));
  const m3a = metaFor(11, 10); a3.forEach((it, i) => push(L3a, it, q3[i], m3a));
  const m3b = metaFor(12, 14);
  const b3head = pick(22); let u3 = 0;
  b3head.forEach(it => { const q = 1 + Math.floor(r()*3); push(L3b, it, q, m3b); u3 += q; });
  a3.slice(0, 18).forEach((it, i) => { push(L3b, it, i < 2 ? 2 : 1, m3b); u3 += (i < 2 ? 2 : 1); });
  const b3tail = pick(30);
  b3tail.forEach(it => { if (u3 >= 100) return; const q = Math.min(2, 100 - u3); push(L3b, it, q, m3b); u3 += q; });
  stores.push(L3a, L3b);

  // --- CASE 5: repeated 20-record scan block inside an otherwise ordinary location
  const L5a = locName(), L5b = locName();
  const block = pick(20);
  const m5a = metaFor(14, 9);
  const pre = pick(12); pre.forEach(it => push(L5a, it, 1 + Math.floor(r()*2), m5a));
  block.forEach(it => push(L5a, it, 1, m5a));
  const post = pick(8); post.forEach(it => push(L5a, it, 1, m5a));
  const m5b = metaFor(16, 13);
  pick(15).forEach(it => push(L5b, it, 1 + Math.floor(r()*2), m5b));
  block.forEach(it => push(L5b, it, 1, m5b));               // same order, same quantities
  pick(14).forEach(it => push(L5b, it, 1 + Math.floor(r()*2), m5b));
  stores.push(L5a, L5b);

  // --- CASE 6: quantity multiple — B holds exactly twice A on 8 shared barcodes
  const L6a = locName(), L6b = locName();
  const a6 = pick(10); const m6a = metaFor(17, 11), m6b = metaFor(18, 15);
  a6.forEach(it => push(L6a, it, 2, m6a));
  a6.slice(0, 8).forEach(it => push(L6b, it, 4, m6b));
  pick(16).forEach(it => push(L6b, it, 1 + Math.floor(r()*2), m6b));
  stores.push(L6a, L6b);

  // --- CASE 7: multi-source — one location absorbs 10 units from each of three others
  const srcs = [locName(), locName(), locName()], L7d = locName();
  const parts = srcs.map(() => pick(10));
  srcs.forEach((L, i) => { const m = metaFor(19 + i, 10 + i);
    parts[i].forEach(it => push(L, it, 1, m));
    pick(10).forEach(it => push(L, it, 1 + Math.floor(r()*2), m)); });
  const m7 = metaFor(23, 17);
  parts.forEach(p => p.forEach(it => push(L7d, it, 1, m7)));
  pick(18).forEach(it => push(L7d, it, 1 + Math.floor(r()*2), m7));
  stores.push(...srcs, L7d);

  // --- 10 more ordinary stores, all carrying the popular SKUs (CASE 4 control)
  for (let s = 0; s < 14; s++){
    const L = locName(); stores.push(L); ordinary.push(L);
    const items = pick(20 + Math.floor(r() * 35)); const m = metaFor(24 + s, 10 + (s % 8));
    items.forEach(it => push(L, it, 1 + Math.floor(r() * 3), m));
    shuffled(popular).forEach(it => { if (r() < 0.85) push(L, it, 1 + Math.floor(r() * 5), m); });
  }

  // --- data-quality noise, deliberately planted
  rows[40] = { ...rows[40], Barcode:'' };
  rows[95] = { ...rows[95], Quantity:-1, Remarks:'correction entry' };
  rows[150] = { ...rows[150], Barcode:'8.90594E+12' };
  rows[210] = { ...rows[210], Location:rows[210].Location.toLowerCase() + ' ' };
  rows[260] = { ...rows[260], Quantity:'two' };
  rows[300] = { ...rows[300], MRP:rows[300].MRP + 100 };

  const headers = ['Sr. No.','Location','Barcode','Article','Category','Description','MRP','Quantity','Value','Date','Time','User','Scanner ID','Remarks'];
  const grid = [headers].concat(rows.map(o => headers.map(h => o[h])));
  return { sheets:['Audit Scan Data'], data:{ 'Audit Scan Data': grid }, name:'Scan_Analytics_Demo_Audit.xlsx', size:grid.length, demo:true };
};

/* ---------------- saving ---------------- */
SG.saveFile = async function(filename, data, mime){
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl){ await dl.save({ filename, data }); return 'saved'; }
  } catch (err){
    if (err && err.code === 'declined') return 'declined';
    if (err && (err.code === 'unavailable' || err.code === 'not_granted')) { /* fall through */ }
    else if (err && err.code) throw new Error(err.message || ('Download failed: ' + err.code));
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  return 'saved';
};

/* ---------------- Excel report ---------------- */
const BRAND_FILL = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF6E1226' } };
const SUB_FILL = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFF7E9EC' } };

function sheetHead(ws, title, cols){
  ws.columns = cols.map(c => ({ header:c.h, key:c.k, width:c.w || 16 }));
  ws.spliceRows(1, 0, [], [], [], []);
  ws.getCell('A1').value = SG.META.product + ' — ' + title;
  ws.getCell('A1').font = { name:'Calibri', size:14, bold:true, color:{ argb:'FF6E1226' } };
  ws.getCell('A2').value = SG.META.tagline + ' · ' + SG.META.company;
  ws.getCell('A2').font = { size:10, color:{ argb:'FF4C4247' } };
  ws.getCell('A3').value = 'Created by ' + SG.META.author + ' · ' + SG.META.email + ' · Generated ' + new Date().toLocaleString('en-IN');
  ws.getCell('A3').font = { size:9, italic:true, color:{ argb:'FF7C7075' } };
  const hr = ws.getRow(5);
  hr.values = cols.map(c => c.h);
  hr.font = { bold:true, color:{ argb:'FFFFFFFF' }, size:10 };
  hr.fill = BRAND_FILL; hr.alignment = { vertical:'middle', wrapText:true }; hr.height = 26;
  ws.views = [{ state:'frozen', ySplit:5 }];
  ws.autoFilter = { from:{ row:5, column:1 }, to:{ row:5, column:cols.length } };
  return 5;
}
function addRows(ws, rows, cols, startRow){
  rows.forEach((r, i) => {
    const row = ws.getRow(startRow + 1 + i);
    row.values = cols.map(c => r[c.k]);
    row.alignment = { vertical:'top' };
    if (i % 2) row.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFFBF8F7' } };
  });
  const foot = ws.getRow(startRow + rows.length + 3);
  foot.getCell(1).value = SG.META.powered + ' · ' + SG.META.footer;
  foot.getCell(1).font = { size:9, italic:true, color:{ argb:'FF7C7075' } };
}
function sheet(wb, name, title, cols, rows){
  const ws = wb.addWorksheet(name.slice(0, 31), { properties:{ tabColor:{ argb:'FF6E1226' } } });
  const s = sheetHead(ws, title, cols);
  addRows(ws, rows, cols, s);
  return ws;
}
const C = (h, k, w) => ({ h, k, w });

SG.exportExcel = async function(res, fileLabel){
  const wb = new ExcelJS.Workbook();
  wb.creator = SG.META.author; wb.company = SG.META.company; wb.created = new Date();
  const t = res.totals, P = res.pairs;
  const pct = n => +(Math.round(n * 10) / 10);

  // 1 Executive summary
  const ws = wb.addWorksheet('Executive Summary', { properties:{ tabColor:{ argb:'FF6E1226' } } });
  ws.columns = [{ width:42 }, { width:26 }, { width:60 }];
  ws.getCell('A1').value = SG.META.product; ws.getCell('A1').font = { size:18, bold:true, color:{ argb:'FF6E1226' } };
  ws.getCell('A2').value = SG.META.tagline; ws.getCell('A2').font = { size:11, color:{ argb:'FF4C4247' } };
  ws.getCell('A3').value = SG.META.company + ' · Created by ' + SG.META.author + ' · ' + SG.META.email;
  ws.getCell('A3').font = { size:10, color:{ argb:'FF7C7075' } };
  ws.getCell('A4').value = 'Source file: ' + fileLabel + ' · Generated ' + new Date().toLocaleString('en-IN');
  ws.getCell('A4').font = { size:10, italic:true };
  const kv = [
    ['Total locations', t.locations], ['Total rows read', t.rows], ['Rows analysed', t.usableRows],
    ['Total units', t.units], ['Unique barcodes', t.uniqueBarcodes], ['Recorded stock value', t.value],
    ['Locations flagged', t.flaggedLocations], ['Doubtful location pairs', t.pairs],
    ['Critical pattern pairs', t.counts.critical], ['High suspicion pairs', t.counts.high],
    ['Moderate suspicion pairs', t.counts.moderate], ['Low suspicion pairs', t.counts.low],
    ['Repeated scan blocks', t.sequences],
    ['Potential duplicate units', t.dupUnits], ['Potential duplicate value (MRP based)', Math.round(t.dupValue)]
  ];
  let rr = 6;
  ws.getCell('A' + rr).value = 'Analysis result'; ws.getCell('A' + rr).font = { bold:true, size:12 };
  ws.getRow(rr).fill = SUB_FILL; rr++;
  kv.forEach(([k, v]) => { ws.getCell('A' + rr).value = k; ws.getCell('B' + rr).value = v;
    ws.getCell('B' + rr).numFmt = '#,##0'; ws.getCell('A' + rr).font = { size:10 }; rr++; });
  rr++;
  ws.getCell('A' + rr).value = 'Detection thresholds used'; ws.getCell('A' + rr).font = { bold:true, size:12 };
  ws.getRow(rr).fill = SUB_FILL; rr++;
  const cfg = res.cfg;
  [['Minimum matching barcodes', cfg.minSharedBarcodes], ['Minimum matching units', cfg.minMatchingUnits],
   ['Minimum overlap %', cfg.minPartialPct], ['Minimum repeated sequence length', cfg.minSeqLen],
   ['Common-barcode ignore threshold %', cfg.commonBarcodePct], ['Value threshold', cfg.valueThreshold]]
   .forEach(([k, v]) => { ws.getCell('A' + rr).value = k; ws.getCell('B' + rr).value = v; rr++; });
  rr += 2;
  ws.getCell('A' + rr).value = 'Risk scores describe data patterns only. They are not proof of misconduct. Every flagged pair requires physical cross-verification before any conclusion is drawn.';
  ws.getCell('A' + rr).font = { italic:true, size:10, color:{ argb:'FF6E1226' } };
  rr += 2;
  ws.getCell('A' + rr).value = SG.META.powered;
  ws.getCell('A' + rr).font = { size:9, italic:true, color:{ argb:'FF7C7075' } };

  // 2 Location summary
  sheet(wb, 'Location Summary', 'Location Summary',
    [C('Location','name',20), C('Rows','rows',9), C('Total Units','units',12), C('Unique Barcodes','uniq',14),
     C('Recorded Value','value',15), C('Suspicious Relationships','relations',20), C('Highest Risk Score','maxScore',16),
     C('Potential Duplicate Units','dupUnits',22), C('Potential Duplicate Value','dupValue',22),
     C('Unmatched Units','genuine',15), C('Potential Duplicate %','dupPct',18)],
    res.composition.map(c => ({ ...c, value:Math.round(c.value), dupValue:Math.round(c.dupValue), dupPct:pct(c.dupPct) })));

  // 3 Doubtful pairs
  const pairCols = [C('Priority','priority',10), C('Location A','a',18), C('Location B','b',18),
    C('Risk Score','score',10), C('Risk Level','level',16), C('Detection Type','detection',26),
    C('Evidence Level','evidence',13), C('Matching Barcodes','mb',16), C('Matching Units','mu',14),
    C('A Total Units','au',13), C('B Total Units','bu',13), C('A→B Match %','ab',13), C('B→A Match %','ba',13),
    C('Potential Duplicate Units','du',22), C('Potential Duplicate Value','dv',22),
    C('Combined Exposure Units','ce',20), C('Repeated Sequence','seq',18), C('Why Flagged','why',80)];
  const pairRows = P.map((p, i) => ({
    priority: p.level.key === 'critical' ? 'CRITICAL' : p.level.key === 'high' ? 'HIGH' : p.level.key === 'moderate' ? 'MEDIUM' : 'LOW',
    a:p.a, b:p.b, score:p.score, level:p.level.label, detection:SG.DETECTION[p.primary],
    evidence:'Level ' + p.evidence, mb:p.matchingBarcodes, mu:p.matchingUnits, au:p.aUnits, bu:p.bUnits,
    ab:pct(p.aToB), ba:pct(p.bToA), du:p.matchingUnits, dv:Math.round(p.valueRisk), ce:p.combinedExposure,
    seq:p.seq.len >= res.cfg.minSeqLen ? `${p.seq.len} records (rows ${p.seq.aFrom}-${p.seq.aTo} / ${p.seq.bFrom}-${p.seq.bTo})` : '',
    why:p.whyFlagged }));
  sheet(wb, 'Doubtful Location Pairs', 'Doubtful Location Pairs', pairCols, pairRows);

  // 4 Barcode comparison (top pairs)
  const cmpCols = [C('Location A','a',18), C('Location B','b',18), C('Barcode','bc',18), C('Article','article',14),
    C('A Qty','qa',9), C('B Qty','qb',9), C('Common Qty','common',12), C('Difference','diff',11),
    C('MRP','mrp',10), C('Value at Risk','value',14), C('Locations Holding Barcode','spread',22),
    C('Sequence Match','seqm',14), C('Status','status',20)];
  const cmpRows = [];
  let cmpTruncated = false;
  for (const p of P){
    if (cmpRows.length > 30000){ cmpTruncated = true; break; }
    p.shared.forEach(s => {
      if (cmpRows.length > 30000) return;
      cmpRows.push({ a:p.a, b:p.b, bc:s.bc, article:s.article, qa:s.qa, qb:s.qb, common:s.common, diff:s.diff,
        mrp:s.mrp, value:s.value == null ? '' : Math.round(s.value), spread:s.spread,
        seqm:s.seqMatch ? 'Yes' : '', status:s.status });
    });
  }
  sheet(wb, 'Barcode Comparison',
    'Barcode-Level Comparison — every doubtful location pair' + (cmpTruncated ? ' (row limit reached)' : ''),
    cmpCols, cmpRows);

  // 5 Potential duplicate units
  const dupRows = [];
  res.composition.filter(c => c.dupUnits > 0).forEach(c => c.sources.forEach(s => dupRows.push({
    loc:c.name, units:c.units, other:s.other, du:s.units, score:s.score,
    detection:SG.DETECTION[s.pair.primary], dupTotal:c.dupUnits, genuine:c.genuine })));
  sheet(wb, 'Potential Duplicate Units', 'Potential Duplicate Units by Location',
    [C('Location','loc',18), C('Total Units','units',12), C('Matched Against','other',18),
     C('Potentially Duplicated Units','du',24), C('Risk Score','score',11), C('Detection Type','detection',26),
     C('Location Duplicate Component','dupTotal',24), C('Unmatched Component','genuine',20)], dupRows);

  // 6-10 by type
  const byType = (t) => pairRows.filter((_, i) => P[i].types.includes(t));
  sheet(wb, 'Exact Duplicates', 'Exact Location Patterns', pairCols, byType('exact').concat(pairRows.filter((_, i) => P[i].types.includes('complete') && !P[i].types.includes('exact'))));
  sheet(wb, 'Partial Duplicates', 'Partial Duplicate Scans', pairCols, byType('partial'));
  sheet(wb, 'Subset Duplicates', 'Subset Duplications', pairCols, byType('subset'));
  const seqRows = P.filter(p => p.seq.len >= res.cfg.minSeqLen).map(p => ({
    a:p.a, b:p.b, len:p.seq.len, aFrom:p.seq.aFrom, aTo:p.seq.aTo, bFrom:p.seq.bFrom, bTo:p.seq.bTo,
    score:p.score, level:p.level.label, bcs:p.seq.barcodes.join(', ') }));
  sheet(wb, 'Sequence Matches', 'Repeated Scan Blocks',
    [C('Location A','a',18), C('Location B','b',18), C('Matching Records','len',16),
     C('A Start Row','aFrom',12), C('A End Row','aTo',12), C('B Start Row','bFrom',12), C('B End Row','bTo',12),
     C('Risk Score','score',11), C('Risk Level','level',16), C('Barcode Sequence','bcs',80)], seqRows);
  const msRows = [];
  res.multiSource.forEach(m => m.sources.forEach(s => msRows.push({
    suspect:m.name, units:m.units, dup:m.dupUnits, pctv:pct(m.dupPct), src:s.other, su:s.units, score:s.score })));
  sheet(wb, 'Multi-Location Patterns', 'Potential Multi-Source Duplicate Patterns',
    [C('Suspect Location','suspect',20), C('Total Units','units',12), C('Potential Duplicate Units','dup',22),
     C('Potential Duplicate %','pctv',18), C('Contributing Location','src',20),
     C('Units from this Source','su',20), C('Risk Score','score',11)], msRows);

  // 11 Data quality
  const dq = [];
  (res.quality || []).forEach(q => {
    if (q.master) q.master.slice(0, 200).forEach(m => dq.push({ type:q.type, severity:q.severity, count:q.count,
      ref:m.bc || m.article || m.lk, detail:(m.values || []).join(' | '), note:q.detail }));
    else (q.rows || []).slice(0, 200).forEach(r => dq.push({ type:q.type, severity:q.severity, count:q.count,
      ref:'Row ' + r.row, detail:[r.loc, r.bc, r.qty].filter(x => x !== '' && x != null).join(' | '), note:q.detail }));
  });
  sheet(wb, 'Data Quality', 'Data Quality Findings',
    [C('Check','type',34), C('Severity','severity',12), C('Total Occurrences','count',16),
     C('Reference','ref',20), C('Detail','detail',44), C('Note','note',60)], dq);

  // 12 Full findings
  sheet(wb, 'Full Findings', 'Full Findings — all flagged relationships',
    pairCols.concat([C('Recommended Verification','verify',80)]),
    pairRows.map((r, i) => ({ ...r, verify:SG.verificationSteps(P[i]).join(' ') })));

  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
};

SG.exportCSV = function(res){
  const rows = res.pairs.map(p => ({
    'Priority': p.level.label, 'Location A':p.a, 'Location B':p.b, 'Risk Score':p.score,
    'Risk Level':p.level.label, 'Detection Type':SG.DETECTION[p.primary], 'Evidence Level':p.evidence,
    'Matching Barcodes':p.matchingBarcodes, 'Matching Units':p.matchingUnits,
    'A Total Units':p.aUnits, 'B Total Units':p.bUnits,
    'A to B Match %':Math.round(p.aToB * 10) / 10, 'B to A Match %':Math.round(p.bToA * 10) / 10,
    'Potential Duplicate Units':p.matchingUnits, 'Potential Duplicate Value':Math.round(p.valueRisk),
    'Repeated Sequence Records':p.seq.len || 0, 'Why Flagged':p.whyFlagged
  }));
  return Papa.unparse(rows);
};
})();
</script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect, useCallback } = React;
const M = SG.META;
const fi = SG.fmtInt, fm = SG.fmtMoney, fp = SG.fmtPct;

/* ---------------- small building blocks ---------------- */
const Card = ({ title, sub, actions, children, pad = true, className = '' }) => (
  <section className={'card ' + className}>
    {(title || actions) && (
      <div className="card-h">
        {title && <div><h3>{title}</h3>{sub && <div className="small muted" style={{marginTop:2}}>{sub}</div>}</div>}
        <div className="sp" />{actions}
      </div>
    )}
    <div className={'card-b' + (pad ? '' : ' tight')}>{children}</div>
  </section>
);

const Kpi = ({ k, v, d, tone }) => (
  <div className={'kpi ' + (tone || '')}>
    <div className="k">{k}</div><div className="v">{v}</div>{d && <div className="d">{d}</div>}
  </div>
);

const RiskTag = ({ level, score }) => (
  <span className={'tag ' + level.key}>{score != null ? score + ' · ' : ''}{level.label}</span>
);

const Meter = ({ value, level }) => (
  <div className="meter">
    <div className="bar" style={{width:62}}>
      <span style={{width:Math.max(3, value) + '%', background:'var(--r-' + level.key + ')'}} />
    </div>
    <span className="score" style={{color:'var(--r-' + level.key + ')'}}>{value}</span>
  </div>
);

const Empty = ({ title, children, action }) => (
  <div className="empty"><h3>{title}</h3><p style={{maxWidth:460,margin:'0 auto 14px'}}>{children}</p>{action}</div>
);

function useSort(initKey, initDir = 'desc'){
  const [s, set] = useState({ k:initKey, dir:initDir });
  const on = k => set(p => ({ k, dir: p.k === k && p.dir === 'desc' ? 'asc' : 'desc' }));
  const sort = (arr, acc) => [...arr].sort((a, b) => {
    const x = acc(a, s.k), y = acc(b, s.k);
    const c = typeof x === 'string' ? x.localeCompare(y) : (x - y);
    return s.dir === 'desc' ? -c : c;
  });
  return { s, on, sort, ind: k => s.k === k ? (s.dir === 'desc' ? ' ↓' : ' ↑') : '' };
}

const Bars = ({ data, fmt = fi, color = 'var(--burgundy-600)', onClick }) => {
  const max = Math.max(1, ...data.map(d => d.v));
  return (
    <div style={{display:'flex',flexDirection:'column',gap:9}}>
      {data.map((d, i) => (
        <div key={i} onClick={onClick ? () => onClick(d) : undefined}
             style={{cursor:onClick ? 'pointer' : 'default'}}>
          <div className="row" style={{justifyContent:'space-between',marginBottom:3,gap:8}}>
            <span className="small" style={{minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.label}</span>
            <span className="small mono" style={{color:'var(--ink-2)'}}>{fmt(d.v)}</span>
          </div>
          <div className="bar"><span style={{width:(d.v / max * 100) + '%',background:d.color || color}} /></div>
        </div>
      ))}
      {!data.length && <div className="small muted">Nothing to plot yet.</div>}
    </div>
  );
};

const Donut = ({ data, size = 168 }) => {
  const total = data.reduce((s, d) => s + d.v, 0) || 1;
  const R = size / 2, r = R - 16, C = 2 * Math.PI * r;
  let acc = 0;
  return (
    <div className="row" style={{gap:18,alignItems:'center',flexWrap:'wrap'}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img">
        <circle cx={R} cy={R} r={r} fill="none" stroke="var(--sunk)" strokeWidth="18" />
        {data.map((d, i) => {
          const frac = d.v / total, dash = `${C * frac} ${C * (1 - frac)}`;
          const off = -C * acc; acc += frac;
          return <circle key={i} cx={R} cy={R} r={r} fill="none" stroke={d.color} strokeWidth="18"
                         strokeDasharray={dash} strokeDashoffset={off}
                         transform={`rotate(-90 ${R} ${R})`}><title>{d.label}: {d.v}</title></circle>;
        })}
        <text x={R} y={R - 2} textAnchor="middle" style={{fontSize:22,fontWeight:600,fill:'var(--ink)'}}>{fi(total)}</text>
        <text x={R} y={R + 16} textAnchor="middle" style={{fontSize:10.5}}>pairs</text>
      </svg>
      <div style={{display:'flex',flexDirection:'column',gap:6,minWidth:150,flex:1}}>
        {data.filter(d => d.v).map((d, i) => (
          <div key={i} className="row small" style={{justifyContent:'space-between'}}>
            <span><i style={{display:'inline-block',width:9,height:9,borderRadius:2,background:d.color,marginRight:7}} />{d.label}</span>
            <span className="mono muted">{d.v}</span>
          </div>
        ))}
      </div>
    </div>
  );
};

const Composition = ({ dup, genuine, height = 12 }) => {
  const total = dup + genuine || 1;
  return (
    <div className="bar" style={{height}}>
      <span style={{width:(dup / total * 100) + '%',background:'var(--r-critical)'}} />
      <span style={{width:(genuine / total * 100) + '%',background:'var(--r-low)'}} />
    </div>
  );
};

/* ---------------- upload & analyse ---------------- */
function UploadView({ st, set, run, toast }){
  const [over, setOver] = useState(false);
  const [mode, setMode] = useState('file');
  const [pasteText, setPasteText] = useState('');
  const inp = useRef();

  const load = async (file) => {
    try {
      set(s => ({ ...s, loading:true }));
      const wb = await SG.readFile(file);
      pick(wb, wb.sheets[0]);
    } catch (e){ toast(e.message, true); set(s => ({ ...s, loading:false })); }
  };
  const pick = (wb, sheetName) => {
    const grid = wb.data[sheetName] || [];
    const hr = SG.findHeaderRow(grid);
    const headers = (grid[hr] || []).map(h => SG.clean(h));
    const map = SG.detectColumns(headers);
    set(s => ({ ...s, wb, sheet:sheetName, grid, headerRow:hr, headers, map, results:null, loading:false, pair:null }));
  };
  const loadPaste = () => {
    try { pick(SG.parsePastedTable(pasteText), 'Pasted Data'); }
    catch (e){ toast(e.message, true); }
  };
  const handlePaste = e => {
    const text = (e.clipboardData || window.clipboardData).getData('text');
    if (text){ e.preventDefault(); setPasteText(text); setTimeout(() => { try { pick(SG.parsePastedTable(text), 'Pasted Data'); } catch (err){ toast(err.message, true); } }, 0); }
  };

  const g = st.grid || [];
  const body = g.slice((st.headerRow || 0) + 1);
  const missing = SG.FIELDS.filter(f => f.req && st.map && st.map[f.key] == null);

  if (!st.wb) return (
    <div className="stack">
      <Card title="Upload an audit file" sub="Processing happens entirely in this browser — nothing is uploaded to a server or an AI service.">
        <div className="tabs" style={{marginBottom:16}}>
          <button className={mode === 'file' ? 'active' : ''} onClick={() => setMode('file')}>Upload file</button>
          <button className={mode === 'paste' ? 'active' : ''} onClick={() => setMode('paste')}>Paste from Excel</button>
        </div>

        {mode === 'file' ? (
          <div className={'dropzone' + (over ? ' over' : '')}
               onClick={() => inp.current.click()}
               onDragOver={e => { e.preventDefault(); setOver(true); }}
               onDragLeave={() => setOver(false)}
               onDrop={e => { e.preventDefault(); setOver(false); if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]); }}>
            <div style={{fontFamily:'var(--serif)',fontSize:17,marginBottom:6}}>Drop your scan file here</div>
            <div className="small muted">XLSX, XLS or CSV · location, barcode and quantity columns required</div>
            <button className="btn primary" style={{marginTop:14}}>Choose file</button>
            <input ref={inp} type="file" accept=".xlsx,.xls,.csv,.xlsm,.tsv" style={{display:'none'}}
                   onChange={e => e.target.files[0] && load(e.target.files[0])} />
          </div>
        ) : (
          <div>
            <textarea value={pasteText} onChange={e => setPasteText(e.target.value)} onPaste={handlePaste}
                      placeholder={'Click here, then paste (Ctrl+V / Cmd+V) a table copied from Excel — include the header row.\n\nLocation\tBarcode\tQuantity\nPTS-Q2-3400\t8905943506560\t2\n…'}
                      className="mono" rows={9}
                      style={{width:'100%',resize:'vertical',padding:'12px 14px',border:'1.5px dashed var(--line-2)',borderRadius:'var(--radius-lg)',background:'var(--sunk)',fontSize:12.5,lineHeight:1.5}} />
            <div className="row" style={{marginTop:12,justifyContent:'space-between'}}>
              <span className="small muted">Pasting analyses automatically. Tab-separated (straight from Excel) or comma-separated both work.</span>
              <button className="btn primary" onClick={loadPaste} disabled={!pasteText.trim()}>Read pasted table</button>
            </div>
          </div>
        )}

        <div className="row" style={{marginTop:14,justifyContent:'space-between'}}>
          <span className="small muted">No file handy? Load a generated audit set covering all seven detection cases.</span>
          <button className="btn" onClick={() => pick(SG.demoData(), 'Audit Scan Data')}>Load demo audit data</button>
        </div>
      </Card>
      <Card title="What the engine looks for">
        <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(230px,1fr))'}}>
          {[['Exact location patterns','Two locations with the same barcodes, frequencies and quantities.'],
            ['Partial duplication','Part of one location reproduced inside a larger, otherwise genuine count.'],
            ['Subset duplication','A small location contained almost entirely within a bigger one.'],
            ['Repeated scan blocks','The same run of records appearing in the same order at another location.'],
            ['Quantity multiples','One location holding an exact multiple of another on the same barcodes.'],
            ['Multi-source patterns','Several locations each contributing a block to one suspect location.']].map(([t, d]) => (
            <div key={t}><div style={{fontWeight:600,marginBottom:3}}>{t}</div><div className="small muted">{d}</div></div>
          ))}
        </div>
        <div className="evidence" style={{marginTop:14}}>
          Common SKUs stocked across many stores are deliberately down-weighted. Overlap alone never raises a flag —
          quantity, frequency, rarity and scan order all have to agree.
        </div>
      </Card>
    </div>
  );

  return (
    <div className="stack">
      <Card title="File loaded" sub={st.wb.name + (st.wb.demo ? ' · generated demo set' : st.wb.pasted ? ' · pasted table' : '')}
            actions={<button className="btn ghost sm" onClick={() => set(s => ({ ...s, wb:null, grid:null, results:null }))}>Start over</button>}>
        <div className="row" style={{gap:18}}>
          {st.wb.sheets.length > 1 && (
            <label className="fld">Sheet
              <select value={st.sheet} onChange={e => pick(st.wb, e.target.value)}>
                {st.wb.sheets.map(s => <option key={s}>{s}</option>)}
              </select>
            </label>
          )}
          <label className="fld">Header row
            <select value={st.headerRow} onChange={e => {
              const hr = +e.target.value;
              const headers = (g[hr] || []).map(h => SG.clean(h));
              set(s => ({ ...s, headerRow:hr, headers, map:SG.detectColumns(headers) }));
            }}>
              {g.slice(0, 12).map((_, i) => <option key={i} value={i}>Row {i + 1}</option>)}
            </select>
          </label>
          <div className="fld"><span>Rows detected</span><strong className="num">{fi(body.length)}</strong></div>
          <div className="fld"><span>Columns</span><strong className="num">{st.headers.length}</strong></div>
        </div>
      </Card>

      <Card title="Column mapping" sub="Auto-detected from the header row. Correct anything the tool guessed wrong.">
        <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(196px,1fr))'}}>
          {SG.FIELDS.map(f => (
            <label className="fld" key={f.key}>
              <span>{f.label}{f.req && <strong style={{color:'var(--burgundy-600)'}}> *</strong>}</span>
              <select value={st.map[f.key] == null ? '' : st.map[f.key]}
                      onChange={e => { const v = e.target.value; set(s => ({ ...s, map:{ ...s.map, [f.key]: v === '' ? null : +v } })); }}>
                <option value="">— not present —</option>
                {st.headers.map((h, i) => <option key={i} value={i}>{h || 'Column ' + (i + 1)}</option>)}
              </select>
            </label>
          ))}
        </div>
        {missing.length > 0 &&
