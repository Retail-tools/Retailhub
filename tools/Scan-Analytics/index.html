          <div className="evidence" style={{marginTop:14,borderColor:'var(--bad)'}}>
            Map {missing.map(m => m.label).join(' and ')} before running the analysis — the engine needs them to build location signatures.
          </div>}
      </Card>

      <Card title="Data preview" sub={`First ${Math.min(10, body.length)} of ${fi(body.length)} rows, as they will be read`} pad={false}>
        <div className="tbl-wrap" style={{maxHeight:340}}>
          <table className="tbl">
            <thead><tr><th className="r">Excel row</th>{st.headers.map((h, i) => <th key={i}>{h || 'Column ' + (i + 1)}</th>)}</tr></thead>
            <tbody>
              {body.slice(0, 10).map((r, i) => (
                <tr key={i}>
                  <td className="r mono muted">{st.headerRow + 2 + i}</td>
                  {st.headers.map((_, c) => <td key={c} className={c === st.map.barcode ? 'mono' : ''}>
                    {c === st.map.barcode ? SG.normBarcode(r[c]) : SG.clean(r[c])}</td>)}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>

      {st.progress ? (
        <Card title="Analysis running">
          <div className="steps">
            {['Normalising records','Building barcode index','Building location signatures','Generating candidate pairs',
              'Running duplication analysis','Analysing scan sequences and quantities','Mapping duplication network',
              'Calculating risk and preparing results','Complete'].map(s => {
              const state = st.progress.label === s ? 'active' : (st.progress.seen.indexOf(s) >= 0 ? 'done' : '');
              return <div className={'step ' + state} key={s}><span className="dot" />{s}</div>;
            })}
          </div>
          <div className="bar" style={{marginTop:14,height:6}}><span style={{width:st.progress.pct + '%',background:'var(--burgundy-600)'}} /></div>
        </Card>
      ) : (
        <div className="row">
          <button className="btn primary" disabled={missing.length > 0} onClick={run}>Run duplication analysis</button>
          <span className="small muted">
            {missing.length ? 'Required columns are still unmapped.' : 'Data loaded successfully. Review the column mapping and run analysis.'}
          </span>
        </div>
      )}
    </div>
  );
}

/* ---------------- dashboard ---------------- */
function Dashboard({ res, go, openPair }){
  const t = res.totals;
  const dist = [
    { label:'Critical pattern', v:t.counts.critical, color:'var(--r-critical)' },
    { label:'High suspicion', v:t.counts.high, color:'var(--r-high)' },
    { label:'Moderate suspicion', v:t.counts.moderate, color:'var(--r-moderate)' },
    { label:'Low suspicion', v:t.counts.low, color:'var(--r-low)' }
  ];
  const typeCounts = {};
  res.pairs.forEach(p => { typeCounts[p.primary] = (typeCounts[p.primary] || 0) + 1; });
  const typeColors = { exact:'var(--r-critical)', complete:'var(--burgundy-600)', subset:'var(--r-high)',
    partial:'var(--r-moderate)', sequence:'var(--burgundy-500)', qtyMult:'var(--r-low)', embedded:'var(--ink-3)', cross:'var(--r-normal)' };
  const typeData = Object.keys(typeCounts).map(k => ({ label:SG.DETECTION[k], v:typeCounts[k], color:typeColors[k] || 'var(--ink-3)' }));
  const topPairs = res.pairs.slice(0, 7);
  const topUnits = res.composition.filter(c => c.dupUnits > 0).slice(0, 7);
  const topValue = [...res.composition].sort((a, b) => b.dupValue - a.dupValue).filter(c => c.dupValue > 0).slice(0, 7);

  if (!res.pairs.length) return (
    <div className="stack">
      <KpiStrip t={t} />
      <Card><Empty title="No cross-location duplication patterns found">
        No significant cross-location duplication patterns were identified based on the current detection thresholds.
        Lower the minimum overlap or matching-barcode settings if you want a wider sweep.
      </Empty></Card>
    </div>
  );

  return (
    <div className="stack">
      <KpiStrip t={t} />
      <div className="grid" style={{gridTemplateColumns:'minmax(300px,1.15fr) minmax(280px,1fr)'}}>
        <Card title="Where to start"
              sub="Highest-risk location pairs — open one to see the barcode-level evidence"
              actions={<button className="btn sm ghost" onClick={() => go('doubtful')}>All {res.pairs.length} pairs</button>}
              pad={false}>
          <div className="tbl-wrap">
            <table className="tbl">
              <thead><tr><th>Pair</th><th>Detection</th><th className="r">Match units</th><th className="r">Risk</th></tr></thead>
              <tbody>
                {topPairs.map(p => (
                  <tr key={p.id} className="clickable" onClick={() => openPair(p)}>
                    <td><span className="rowmark" style={{background:'var(--r-' + p.level.key + ')'}} />
                      <strong className="mono">{p.a}</strong> <span className="muted">↔</span> <strong className="mono">{p.b}</strong></td>
                    <td className="small">{SG.DETECTION[p.primary]}</td>
                    <td className="r num">{fi(p.matchingUnits)}</td>
                    <td className="r"><Meter value={p.score} level={p.level} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
        <Card title="Risk distribution" sub="Flagged location pairs by severity">
          <Donut data={dist} />
          <div className="divider" />
          <h4 style={{fontSize:13,marginBottom:10}}>Detection types</h4>
          <Bars data={typeData} fmt={v => v + ' pairs'} />
        </Card>
      </div>
      <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))'}}>
        <Card title="Potential duplicate units by location" sub="Duplicate component isolated from genuine stock">
          <Bars data={topUnits.map(c => ({ label:c.name, v:c.dupUnits }))} onClick={d => go('stock')} />
        </Card>
        <Card title="Potential duplicate value by location" sub="Duplicated quantity × MRP">
          <Bars data={topValue.map(c => ({ label:c.name, v:Math.round(c.dupValue) }))} fmt={fm} color="var(--burgundy-500)" />
        </Card>
        <Card title="Suspicious location heat" sub="Locations ranked by their strongest relationship">
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            {res.composition.filter(c => c.relations).slice(0, 34).map(c => (
              <span key={c.lk} className="chip btn-like" onClick={() => go('network')}
                    style={{background:'var(--r-' + SG.levelOf(c.maxScore).key + '-bg)',
                            color:'var(--r-' + SG.levelOf(c.maxScore).key + ')',borderColor:'transparent'}}>
                <span className="mono">{c.name}</span> {c.maxScore}
              </span>
            ))}
          </div>
          <div className="legend" style={{marginTop:14}}>
            {['critical','high','moderate','low'].map(k => (
              <span key={k}><i style={{background:'var(--r-' + k + ')'}} />{SG.LEVELS.find(l => l.key === k).label}</span>
            ))}
          </div>
        </Card>
      </div>
      <div className="evidence">
        Risk scores describe patterns in the scan data. They are not proof of misconduct — every flagged pair needs physical cross-verification.
      </div>
    </div>
  );
}

const KpiStrip = ({ t }) => (
  <div className="kpis">
    <Kpi k="Locations" v={fi(t.locations)} d={`${fi(t.rows)} rows read`} />
    <Kpi k="Total units" v={fi(t.units)} d={`${fi(t.uniqueBarcodes)} unique barcodes`} />
    <Kpi k="Locations flagged" v={fi(t.flaggedLocations)} d={`${fi(t.pairs)} doubtful pairs`} tone="accent" />
    <Kpi k="Critical patterns" v={fi(t.counts.critical)} d={`${fi(t.counts.high)} high suspicion`} tone="crit" />
    <Kpi k="Potential duplicate units" v={fi(t.dupUnits)} d={`${fi(t.sequences)} repeated scan blocks`} tone="high" />
    <Kpi k="Potential duplicate value" v={fm(t.dupValue)} d="MRP based, duplicated quantity only" />
  </div>
);


/* ---------------- doubtful location pairs ---------------- */
function DoubtfulView({ res, openPair }){
  const [lvl, setLvl] = useState([]);
  const [typ, setTyp] = useState([]);
  const [q, setQ] = useState('');
  const [minU, setMinU] = useState(0);
  const [minEv, setMinEv] = useState(1);
  const [exp, setExp] = useState(() => new Set());
  const { s, on, sort, ind } = useSort('score');
  const tog = (arr, setA, v) => setA(arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]);
  const toggleExp = (id, e) => { e.stopPropagation();
    setExp(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; }); };

  const rows = useMemo(() => {
    let r = res.pairs.filter(p =>
      (!lvl.length || lvl.includes(p.level.key)) &&
      p.evidence >= minEv &&
      (!typ.length || typ.some(t => p.types.includes(t))) &&
      (!q || (p.a + ' ' + p.b).toLowerCase().includes(q.toLowerCase())) &&
      p.matchingUnits >= minU);
    return sort(r, (p, k) => ({
      score:p.score, mu:p.matchingUnits, mb:p.matchingBarcodes, ab:p.aToB, ba:p.bToA,
      dv:p.valueRisk, a:p.a, b:p.b, type:SG.DETECTION[p.primary], ev:p.evidence
    }[k]));
  }, [res, lvl, typ, q, minU, minEv, s]);

  return (
    <div className="stack">
      <Card title="Filters" pad>
        <div className="row" style={{gap:16}}>
          <div className="row" style={{gap:5}}>
            {['critical','high','moderate','low'].map(k => (
              <span key={k} className={'chip btn-like' + (lvl.includes(k) ? ' on' : '')} onClick={() => tog(lvl, setLvl, k)}>
                {SG.LEVELS.find(l => l.key === k).label}
              </span>
            ))}
          </div>
          <div className="row" style={{gap:5}}>
            {['exact','complete','partial','subset','sequence','qtyMult','multi','cross'].map(k => (
              <span key={k} className={'chip btn-like' + (typ.includes(k) ? ' on' : '')} onClick={() => tog(typ, setTyp, k)}>
                {SG.DETECTION[k].replace('Potential ','').replace(' Duplicate Scan',' duplicate').replace('Duplicate ','')}
              </span>
            ))}
          </div>
          <div className="sp" style={{flex:1}} />
          <label className="fld">Minimum matching units
            <input type="number" min="0" style={{width:120}} value={minU} onChange={e => setMinU(+e.target.value || 0)} />
          </label>
          <label className="fld">Minimum evidence level
            <select value={minEv} onChange={e => setMinEv(+e.target.value)}>
              {[1,2,3,4,5,6,7].map(n => <option key={n} value={n}>Level {n} and above</option>)}
            </select>
          </label>
          <label className="fld">Search location
            <input type="search" placeholder="PTS-Q2-34…" value={q} onChange={e => setQ(e.target.value)} />
          </label>
        </div>
      </Card>

      <Card title={`Doubtful location pairs (${rows.length})`}
            sub="Sorted by pattern risk. Expand a row for barcode-wise comparison, or open it for the full investigation." pad={false}>
        {!rows.length ? (
          <Empty title="Nothing matches those filters">Clear a filter or lower the minimum matching units.</Empty>
        ) : (
        <div className="tbl-wrap" style={{maxHeight:'66vh'}}>
          <table className="tbl">
            <thead><tr>
              <th style={{width:28}}></th>
              <th className="sortable" onClick={() => on('score')}>Priority{ind('score')}</th>
              <th className="sortable" onClick={() => on('a')}>Location A{ind('a')}</th>
              <th className="sortable" onClick={() => on('b')}>Location B{ind('b')}</th>
              <th className="r sortable" onClick={() => on('score')}>Risk{ind('score')}</th>
              <th className="sortable" onClick={() => on('type')}>Detection type{ind('type')}</th>
              <th className="c sortable" onClick={() => on('ev')}>Evid.{ind('ev')}</th>
              <th className="r sortable" onClick={() => on('mb')}>Barcodes{ind('mb')}</th>
              <th className="r sortable" onClick={() => on('mu')}>Match units{ind('mu')}</th>
              <th className="r">A units</th><th className="r">B units</th>
              <th className="r sortable" onClick={() => on('ab')}>A→B{ind('ab')}</th>
              <th className="r sortable" onClick={() => on('ba')}>B→A{ind('ba')}</th>
              <th className="r sortable" onClick={() => on('dv')}>Value at risk{ind('dv')}</th>
              <th>Evidence</th>
            </tr></thead>
            <tbody>
              {rows.map(p => (
                <React.Fragment key={p.id}>
                <tr className="clickable" onClick={() => openPair(p)}>
                  <td onClick={e => toggleExp(p.id, e)} style={{cursor:'pointer',color:'var(--ink-3)',textAlign:'center'}}>
                    {exp.has(p.id) ? '▾' : '▸'}
                  </td>
                  <td><RiskTag level={p.level} /></td>
                  <td className="mono">{p.a}</td>
                  <td className="mono">{p.b}</td>
                  <td className="r"><Meter value={p.score} level={p.level} /></td>
                  <td className="small">{SG.DETECTION[p.primary]}</td>
                  <td className="c mono">{p.evidence}</td>
                  <td className="r num">{fi(p.matchingBarcodes)}</td>
                  <td className="r num"><strong>{fi(p.matchingUnits)}</strong></td>
                  <td className="r num muted">{fi(p.aUnits)}</td>
                  <td className="r num muted">{fi(p.bUnits)}</td>
                  <td className="r num">{fp(p.aToB)}</td>
                  <td className="r num">{fp(p.bToA)}</td>
                  <td className="r num">{fm(p.valueRisk)}</td>
                  <td className="small muted" style={{maxWidth:280}}>
                    {p.types.includes('exact') ? 'Identical barcode and quantity signature'
                      : p.seq.len >= res.cfg.minSeqLen ? `${p.seq.len}-record scan block repeated`
                      : `${p.freqMatch} of ${p.matchingBarcodes} barcodes match on frequency`}
                  </td>
                </tr>
                {exp.has(p.id) && (
                  <tr>
                    <td colSpan={15} style={{background:'var(--sunk)',padding:0}}>
                      <div style={{padding:'12px 16px'}}>
                        <div className="row" style={{justifyContent:'space-between',marginBottom:8}}>
                          <div className="small" style={{fontWeight:600}}>
                            Barcode-wise comparison — <span className="mono">{p.a}</span> vs <span className="mono">{p.b}</span>
                            <span className="muted"> · showing {Math.min(30, p.shared.length)} of {p.matchingBarcodes}</span>
                          </div>
                          <button className="btn sm" onClick={e => { e.stopPropagation(); openPair(p); }}>Open full investigation</button>
                        </div>
                        <div className="tbl-wrap" style={{maxHeight:280}}>
                          <table className="tbl">
                            <thead><tr>
                              <th>Barcode</th><th>Article</th><th className="r">A qty</th><th className="r">B qty</th>
                              <th className="r">Common</th><th className="r">Diff</th><th className="r">MRP</th>
                              <th className="r">Value at risk</th><th>Status</th>
                            </tr></thead>
                            <tbody>
                              {p.shared.slice(0, 30).map((sh, i) => (
                                <tr key={i} className={sh.status === 'EXACT MATCH' ? 'flagged' : ''}>
                                  <td className="mono">{sh.bc}</td>
                                  <td className="small">{sh.article || '—'}</td>
                                  <td className="r num">{sh.qa || '—'}</td>
                                  <td className="r num">{sh.qb || '—'}</td>
                                  <td className="r num"><strong>{sh.common || '—'}</strong></td>
                                  <td className="r num muted">{sh.diff || '—'}</td>
                                  <td className="r num muted">{sh.mrp ? fm(sh.mrp) : '—'}</td>
                                  <td className="r num">{sh.value ? fm(sh.value) : '—'}</td>
                                  <td><span className={'tag ' + (sh.status === 'EXACT MATCH' ? 'critical' : sh.status === 'QUANTITY MULTIPLE' ? 'high' : sh.status === 'QUANTITY DIFFERENCE' || sh.status === 'PARTIAL MATCH' ? 'moderate' : 'neutral')}>{sh.status}</span></td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                        {p.matchingBarcodes > 30 && (
                          <div className="small muted" style={{marginTop:6}}>
                            {p.matchingBarcodes - 30} more matching barcodes — open the full investigation for the complete list, A-only/B-only rows, sequence evidence and export.
                          </div>
                        )}
                      </div>
                    </td>
                  </tr>
                )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>)}
      </Card>
    </div>
  );
}

/* ---------------- pair investigation ---------------- */
function PairView({ p, res, back, toast }){
  const [f, setF] = useState('all');
  const [q, setQ] = useState('');
  const A = res.locs.get(p.aKey), B = res.locs.get(p.bKey);

  const all = useMemo(() => {
    const out = p.shared.map(s => ({ ...s, side:'both' }));
    A.qty.forEach((qa, bc) => { if (!B.qty.has(bc)) out.push({ bc, qa, qb:0, common:0, diff:qa,
      mrp:A.mrp.get(bc) || null, article:A.article.get(bc) || '', spread:res.spread.get(bc) || 1,
      value:null, status:'A ONLY', side:'a' }); });
    B.qty.forEach((qb, bc) => { if (!A.qty.has(bc)) out.push({ bc, qa:0, qb, common:0, diff:qb,
      mrp:B.mrp.get(bc) || null, article:B.article.get(bc) || '', spread:res.spread.get(bc) || 1,
      value:null, status:'B ONLY', side:'b' }); });
    return out;
  }, [p]);

  const rows = all.filter(s =>
    (f === 'all' || (f === 'exact' && s.status === 'EXACT MATCH') ||
     (f === 'qty' && (s.status === 'QUANTITY DIFFERENCE' || s.status === 'QUANTITY MULTIPLE')) ||
     (f === 'dup' && s.side === 'both') || (f === 'seq' && s.seqMatch)) &&
    (!q || s.bc.includes(q) || (s.article || '').toLowerCase().includes(q.toLowerCase())));

  const exportCmp = async () => {
    const csv = Papa.unparse(all.map(s => ({ 'Location A':p.a, 'Location B':p.b, Barcode:s.bc, Article:s.article,
      'A Qty':s.qa, 'B Qty':s.qb, 'Common Qty':s.common, Difference:s.diff, MRP:s.mrp || '',
      'Value at Risk':s.value == null ? '' : Math.round(s.value), 'Locations holding barcode':s.spread,
      'Sequence Match':s.seqMatch ? 'Yes' : '', Status:s.status })));
    await SG.saveFile(`ScanAnalytics_${p.a}_vs_${p.b}.csv`.replace(/[^\w.\-]/g,'_'), csv, 'text/csv');
    toast('Barcode comparison exported.');
  };

  const statusTag = s => s.status === 'EXACT MATCH' ? 'critical' : s.status === 'QUANTITY MULTIPLE' ? 'high'
    : s.status === 'QUANTITY DIFFERENCE' ? 'moderate' : s.status === 'PARTIAL MATCH' ? 'moderate' : 'neutral';

  return (
    <div className="stack">
      <div className="row">
        <button className="btn ghost sm" onClick={back}>← Back to doubtful locations</button>
        <div className="sp" style={{flex:1}} />
        <button className="btn sm" onClick={exportCmp}>Export comparison</button>
      </div>

      <Card>
        <div className="row" style={{justifyContent:'space-between',alignItems:'flex-start',gap:20}}>
          <div>
            <div className="small muted">Location pair under investigation</div>
            <h1 style={{marginTop:4}}><span className="mono">{p.a}</span> <span className="muted">↔</span> <span className="mono">{p.b}</span></h1>
            <div className="row" style={{marginTop:9}}>
              <RiskTag level={p.level} score={p.score} />
              <span className="tag neutral">{SG.DETECTION[p.primary]}</span>
              <span className="tag neutral">Evidence level {p.evidence} of 7</span>
              {p.types.filter(t => t !== p.primary).map(t => <span key={t} className="tag neutral">{SG.DETECTION[t]}</span>)}
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <div className="small muted">Requires physical cross-verification</div>
            <div style={{fontFamily:'var(--serif)',fontSize:30,fontWeight:600,color:'var(--r-' + p.level.key + ')'}}>{p.score}</div>
            <div className="xs muted">pattern risk, not proof</div>
          </div>
        </div>
        <div className="divider" />
        <div className="kpis">
          <Kpi k="Matching barcodes" v={fi(p.matchingBarcodes)} d={`${p.freqMatch} with identical frequency`} />
          <Kpi k="Matching units" v={fi(p.matchingUnits)} d="counted once, not doubled" />
          <Kpi k={p.a + ' units'} v={fi(p.aUnits)} d={`${fi(p.aUnique)} unmatched`} />
          <Kpi k={p.b + ' units'} v={fi(p.bUnits)} d={`${fi(p.bUnique)} unmatched`} />
          <Kpi k="A→B / B→A" v={fp(p.aToB) + ' / ' + fp(p.bToA)} d="share of each location matched" />
          <Kpi k="Potential duplicate value" v={fm(p.valueRisk)} d={`combined exposure ${fi(p.combinedExposure)} units`} tone="crit" />
        </div>
      </Card>

      <Card title="Why this pair was flagged">
        <div className="evidence">{p.whyFlagged}</div>
      </Card>

      <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(290px,1fr))'}}>
        {[[p.a, p.aUnits, p.matchingUnits, p.aUnique], [p.b, p.bUnits, p.matchingUnits, p.bUnique]].map(([n, tot, dup, gen]) => (
          <Card key={n} title={n + ' stock composition'} sub={`${fi(tot)} total units`}>
            <Composition dup={dup} genuine={gen} height={16} />
            <div className="row" style={{justifyContent:'space-between',marginTop:10}}>
              <div><div className="small" style={{color:'var(--r-critical)'}}>Potentially duplicated</div>
                <div style={{fontFamily:'var(--serif)',fontSize:21}}>{fi(dup)} <span className="small muted">({fp(tot ? dup / tot * 100 : 0)})</span></div></div>
              <div style={{textAlign:'right'}}><div className="small" style={{color:'var(--r-low)'}}>Unmatched / additional</div>
                <div style={{fontFamily:'var(--serif)',fontSize:21}}>{fi(gen)} <span className="small muted">({fp(tot ? gen / tot * 100 : 0)})</span></div></div>
            </div>
          </Card>
        ))}
      </div>

      {p.seq.len >= 3 && (
        <Card title="Repeated scan block" sub={`${p.seq.len} records appear in the same order at both locations`}>
          <div className="row" style={{gap:30}}>
            <div><div className="small muted">Source</div><div className="mono">{p.a} · rows {p.seq.aFrom}–{p.seq.aTo}</div></div>
            <div><div className="small muted">Potential repeat</div><div className="mono">{p.b} · rows {p.seq.bFrom}–{p.seq.bTo}</div></div>
            <div><div className="small muted">Matching records</div><div className="mono">{p.seq.len}</div></div>
          </div>
          <div className="scroll-x" style={{marginTop:12,display:'flex',gap:6,paddingBottom:6}}>
            {p.seq.barcodes.map((b, i) => <span key={i} className="chip mono xs">{b}</span>)}
          </div>
        </Card>
      )}

      <Card title="Barcode-level comparison" sub={`${rows.length} of ${all.length} barcodes shown`} pad={false}
            actions={
              <div className="row" style={{gap:6}}>
                <input type="search" placeholder="Search barcode or article" value={q} onChange={e => setQ(e.target.value)} />
                {[['all','All'],['dup','Potential duplicates'],['exact','Exact matches'],['qty','Quantity differences'],['seq','Sequence']].map(([k, l]) => (
                  <span key={k} className={'chip btn-like' + (f === k ? ' on' : '')} onClick={() => setF(k)}>{l}</span>
                ))}
              </div>}>
        <div className="tbl-wrap" style={{maxHeight:'58vh'}}>
          <table className="tbl">
            <thead><tr>
              <th>Barcode</th><th>Article</th><th className="r">A qty</th><th className="r">B qty</th>
              <th className="r">Common</th><th className="r">Diff</th><th className="r">MRP</th>
              <th className="r">Value at risk</th><th className="c">In locations</th><th className="c">Seq</th><th>Status</th>
            </tr></thead>
            <tbody>
              {rows.slice(0, 600).map((s, i) => (
                <tr key={i} className={s.status === 'EXACT MATCH' ? 'flagged' : ''}>
                  <td className="mono">{s.bc}</td>
                  <td className="small">{s.article || '—'}</td>
                  <td className="r num">{s.qa || '—'}</td>
                  <td className="r num">{s.qb || '—'}</td>
                  <td className="r num"><strong>{s.common || '—'}</strong></td>
                  <td className="r num muted">{s.diff || '—'}</td>
                  <td className="r num muted">{s.mrp ? fm(s.mrp) : '—'}</td>
                  <td className="r num">{s.value ? fm(s.value) : '—'}</td>
                  <td className="c num muted">{s.spread}</td>
                  <td className="c">{s.seqMatch ? '●' : ''}</td>
                  <td><span className={'tag ' + statusTag(s)}>{s.status}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {rows.length > 600 && <div className="small muted" style={{padding:'10px 16px'}}>Showing the first 600 rows — export the comparison for the full list.</div>}
      </Card>

      <Card title="Recommended physical cross-verification"
            sub="Data evidence stops here. The next step happens on the floor.">
        <div className="evidence" style={{marginBottom:14}}>
          Physically cross-check the matching barcode set between {p.a} and {p.b}: {fi(p.matchingUnits)} units across {fi(p.matchingBarcodes)} barcodes, {fm(p.valueRisk)} at risk.
        </div>
        <ol style={{margin:0,paddingLeft:20,display:'flex',flexDirection:'column',gap:7}}>
          {SG.verificationSteps(p).map((s, i) => <li key={i} className="small">{s}</li>)}
        </ol>
      </Card>
    </div>
  );
}

/* ---------------- barcode explorer ---------------- */
function BarcodeView({ res, openPair }){
  const [q, setQ] = useState('');
  const hit = q ? res.bcIndex.get(SG.normBarcode(q)) : null;
  const suggestions = useMemo(() => {
    if (!q || hit) return [];
    const nq = SG.normBarcode(q);
    const out = [];
    for (const [bc, B] of res.bcIndex){ if (bc.includes(nq)) { out.push(B); if (out.length >= 12) break; } }
    return out;
  }, [q, res]);
  const rel = hit ? res.pairs.filter(p => p.shared.some(s => s.bc === hit.bc)) : [];
  const spreadNote = hit && hit.locs.size > Math.max(3, res.totals.locations * res.cfg.commonBarcodePct / 100);

  return (
    <div className="stack">
      <Card title="Barcode search" sub="Find every location holding a barcode and see whether the spread is ordinary or suspicious">
        <input type="search" value={q} onChange={e => setQ(e.target.value)} placeholder="8905943506560"
               className="mono" style={{width:'100%',maxWidth:380,fontSize:15,padding:'10px 12px'}} />
        {suggestions.length > 0 && (
          <div className="row" style={{marginTop:10}}>
            {suggestions.map(b => <span key={b.bc} className="chip btn-like mono" onClick={() => setQ(b.bc)}>{b.bc}</span>)}
          </div>
        )}
        {q && !hit && !suggestions.length && <div className="small muted" style={{marginTop:12}}>No barcode in this file matches that input.</div>}
      </Card>

      {hit && (
        <>
          <Card title={hit.bc} sub={[hit.article, hit.desc, hit.category].filter(Boolean).join(' · ') || 'No master data on this barcode'}>
            <div className="kpis">
              <Kpi k="Total units" v={fi(hit.total)} d={`${fi(hit.rows)} scan rows`} />
              <Kpi k="Locations" v={fi(hit.locs.size)} d={spreadNote ? 'widely stocked SKU' : 'narrow distribution'} tone={spreadNote ? '' : 'accent'} />
              <Kpi k="MRP" v={hit.mrp ? fm(hit.mrp) : '—'} d="highest observed" />
              <Kpi k="Flagged relationships" v={fi(rel.length)} d="pairs using this barcode as evidence" tone={rel.length ? 'crit' : ''} />
            </div>
            <div className="evidence" style={{marginTop:14}}>
              {spreadNote
                ? `This barcode sits in ${hit.locs.size} of ${res.totals.locations} locations. That spread is normal retail distribution and on its own carries very little weight in the risk score.`
                : `This barcode appears in ${hit.locs.size} location${hit.locs.size === 1 ? '' : 's'}. Rare barcodes carry more weight when they turn up in a matching group.`}
            </div>
          </Card>

          <Card title="Locations holding this barcode" pad={false}>
            <div className="tbl-wrap" style={{maxHeight:380}}>
              <table className="tbl">
                <thead><tr><th>Location</th><th className="r">Quantity</th><th className="r">Scan rows</th><th>Excel rows</th><th className="c">Flagged</th></tr></thead>
                <tbody>
                  {[...hit.locs.values()].sort((a, b) => b.qty - a.qty).map(L => {
                    const flagged = rel.some(p => p.aKey === L.lk || p.bKey === L.lk);
                    return (
                      <tr key={L.lk} className={flagged ? 'flagged' : ''}>
                        <td className="mono">{L.name}</td>
                        <td className="r num">{fi(L.qty)}</td>
                        <td className="r num muted">{L.rows.length}</td>
                        <td className="small mono muted">{L.rows.slice(0, 8).join(', ')}{L.rows.length > 8 ? '…' : ''}</td>
                        <td className="c">{flagged ? <span className="tag critical">In evidence</span> : <span className="tag neutral">—</span>}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </Card>

          {rel.length > 0 && (
            <Card title="Relationships that use this barcode" pad={false}>
              <div className="tbl-wrap">
                <table className="tbl">
                  <thead><tr><th>Pair</th><th>Detection</th><th className="r">Qty A / B</th><th className="r">Risk</th></tr></thead>
                  <tbody>
                    {rel.slice(0, 40).map(p => {
                      const s = p.shared.find(x => x.bc === hit.bc);
                      return (
                        <tr key={p.id} className="clickable" onClick={() => openPair(p)}>
                          <td className="mono">{p.a} ↔ {p.b}</td>
                          <td className="small">{SG.DETECTION[p.primary]}</td>
                          <td className="r num">{s.qa} / {s.qb}</td>
                          <td className="r"><Meter value={p.score} level={p.level} /></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </Card>
          )}
        </>
      )}
    </div>
  );
}

/* ---------------- duplication network ---------------- */
function NetworkView({ res, openPair }){
  const [sel, setSel] = useState(null);
  const data = useMemo(() => {
    const deg = new Map();
    res.pairs.forEach(p => { deg.set(p.aKey, (deg.get(p.aKey) || 0) + p.matchingUnits);
                             deg.set(p.bKey, (deg.get(p.bKey) || 0) + p.matchingUnits); });
    const keys = [...deg.entries()].sort((a, b) => b[1] - a[1]).slice(0, 34).map(e => e[0]);
    const set = new Set(keys);
    const W = 820, H = 540, cx = W / 2, cy = H / 2, rx = W / 2 - 92, ry = H / 2 - 62;
    const nodes = keys.map((k, i) => {
      const a = (i / keys.length) * Math.PI * 2 - Math.PI / 2;
      const c = res.composition.find(c => c.lk === k);
      return { k, name:c ? c.name : k, x:cx + rx * Math.cos(a), y:cy + ry * Math.sin(a),
               units:c ? c.units : 0, dup:c ? c.dupUnits : 0, rel:c ? c.relations : 0, score:c ? c.maxScore : 0 };
    });
    const pos = new Map(nodes.map(n => [n.k, n]));
    const edges = res.pairs.filter(p => set.has(p.aKey) && set.has(p.bKey))
      .map(p => ({ p, a:pos.get(p.aKey), b:pos.get(p.bKey) }));
    const maxU = Math.max(1, ...edges.map(e => e.p.matchingUnits));
    return { nodes, edges, maxU, W, H };
  }, [res]);

  const selNode = sel && data.nodes.find(n => n.k === sel);
  const selPairs = sel ? res.pairs.filter(p => p.aKey === sel || p.bKey === sel).sort((a, b) => b.score - a.score) : [];

  if (!res.pairs.length) return <Card><Empty title="No network to draw">No cross-location duplication patterns were identified at the current thresholds.</Empty></Card>;

  return (
    <div className="stack">
      <Card title="Duplication network" sub="Each node is a location. Line weight shows matching units, colour shows risk. Click a node to inspect, a line to open the pair.">
        <div className="scroll-x">
          <svg viewBox={`0 0 ${data.W} ${data.H}`} style={{width:'100%',minWidth:660,height:'auto'}}>
            {data.edges.map((e, i) => (
              <line key={i} className="net-edge" x1={e.a.x} y1={e.a.y} x2={e.b.x} y2={e.b.y}
                    stroke={'var(--r-' + e.p.level.key + ')'}
                    strokeWidth={1 + (e.p.matchingUnits / data.maxU) * 7}
                    strokeOpacity={sel && e.p.aKey !== sel && e.p.bKey !== sel ? 0.12 : 0.55}
                    onClick={() => openPair(e.p)}>
                <title>{e.p.a} ↔ {e.p.b} · {e.p.matchingUnits} matching units · risk {e.p.score}</title>
              </line>
            ))}
            {data.nodes.map(n => {
              const r = 7 + Math.min(14, Math.sqrt(n.dup) * 1.5);
              const lvl = SG.levelOf(n.score);
              return (
                <g key={n.k} className="net-node" onClick={() => setSel(sel === n.k ? null : n.k)}>
                  <circle cx={n.x} cy={n.y} r={r} fill={'var(--r-' + lvl.key + ')'}
                          fillOpacity={sel && sel !== n.k ? 0.25 : 0.9}
                          stroke="var(--paper)" strokeWidth="2" />
                  <text x={n.x} y={n.y + r + 12} textAnchor="middle" style={{fontSize:9.5,fontFamily:'var(--mono)'}}>{n.name}</text>
                  <title>{n.name} · {n.units} units · {n.dup} potentially duplicated · {n.rel} relationships</title>
                </g>
              );
            })}
          </svg>
        </div>
        <div className="legend">
          {['critical','high','moderate','low'].map(k => <span key={k}><i style={{background:'var(--r-' + k + ')'}} />{SG.LEVELS.find(l => l.key === k).label}</span>)}
          <span className="muted">Node size = potentially duplicated units</span>
        </div>
      </Card>

      {selNode && (
        <Card title={selNode.name} sub={`${selNode.rel} suspicious relationship${selNode.rel === 1 ? '' : 's'}`}
              actions={<button className="btn ghost sm" onClick={() => setSel(null)}>Clear selection</button>} pad={false}>
          <div className="card-b" style={{paddingBottom:0}}>
            <div className="kpis">
              <Kpi k="Total units" v={fi(selNode.units)} />
              <Kpi k="Potentially duplicated" v={fi(selNode.dup)} tone="crit" />
              <Kpi k="Highest risk" v={selNode.score} d={SG.levelOf(selNode.score).label} />
            </div>
          </div>
          <div className="tbl-wrap" style={{marginTop:14}}>
            <table className="tbl">
              <thead><tr><th>Counterpart</th><th>Detection</th><th className="r">Matching units</th><th className="r">Value at risk</th><th className="r">Risk</th></tr></thead>
              <tbody>
                {selPairs.map(p => (
                  <tr key={p.id} className="clickable" onClick={() => openPair(p)}>
                    <td className="mono">{p.aKey === sel ? p.b : p.a}</td>
                    <td className="small">{SG.DETECTION[p.primary]}</td>
                    <td className="r num">{fi(p.matchingUnits)}</td>
                    <td className="r num">{fm(p.valueRisk)}</td>
                    <td className="r"><Meter value={p.score} level={p.level} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      <RiskMatrix res={res} openPair={openPair} />

      {res.multiSource.length > 0 && (
        <Card title="Potential multi-source duplicate patterns"
              sub="One location whose stock overlaps blocks from several different locations" pad={false}>
          <div className="tbl-wrap">
            <table className="tbl">
              <thead><tr><th>Suspect location</th><th className="r">Total units</th><th className="r">Potential duplicate units</th>
                <th className="r">Share</th><th>Contributing locations</th></tr></thead>
              <tbody>
                {res.multiSource.map(m => (
                  <tr key={m.lk}>
                    <td className="mono">{m.name}</td>
                    <td className="r num">{fi(m.units)}</td>
                    <td className="r num"><strong>{fi(m.dupUnits)}</strong></td>
                    <td className="r num">{fp(m.dupPct)}</td>
                    <td><div className="row" style={{gap:5}}>
                      {m.sources.map(s => (
                        <span key={s.otherKey} className="chip btn-like mono xs" onClick={() => openPair(s.pair)}>
                          {s.other} · {fi(s.units)}u
                        </span>
                      ))}
                    </div></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
      )}
    </div>
  );
}

/* ---------------- location risk matrix ---------------- */
function RiskMatrix({ res, openPair }){
  const { keys, names, cell } = useMemo(() => {
    const deg = new Map();
    res.pairs.forEach(p => { deg.set(p.aKey, (deg.get(p.aKey) || 0) + p.score);
                             deg.set(p.bKey, (deg.get(p.bKey) || 0) + p.score); });
    const keys = [...deg.entries()].sort((a, b) => b[1] - a[1]).slice(0, 18).map(e => e[0]);
    const names = new Map(res.composition.map(c => [c.lk, c.name]));
    const cell = new Map();
    res.pairs.forEach(p => { cell.set(p.aKey + '|' + p.bKey, p); cell.set(p.bKey + '|' + p.aKey, p); });
    return { keys, names, cell };
  }, [res]);
  if (keys.length < 2) return null;
  return (
    <Card title="Location risk matrix" sub="Every flagged location against every other. Cell value is the pattern risk score." pad={false}>
      <div className="tbl-wrap" style={{maxHeight:520}}>
        <table className="tbl">
          <thead><tr><th style={{left:0,position:'sticky',background:'var(--sunk)',zIndex:3}}>Location</th>
            {keys.map(k => <th key={k} className="c mono" style={{fontSize:9.5}}>{(names.get(k) || k).replace('PTS-Q2-','')}</th>)}</tr></thead>
          <tbody>
            {keys.map(a => (
              <tr key={a}>
                <td className="mono" style={{left:0,position:'sticky',background:'var(--paper)',fontSize:12}}>{names.get(a) || a}</td>
                {keys.map(b => {
                  if (a === b) return <td key={b} className="c" style={{background:'var(--sunk)'}}>·</td>;
                  const p = cell.get(a + '|' + b);
                  if (!p) return <td key={b} className="c muted xs">—</td>;
                  return (
                    <td key={b} className="c clickable" onClick={() => openPair(p)}
                        style={{background:'var(--r-' + p.level.key + '-bg)', color:'var(--r-' + p.level.key + ')', fontWeight:600, cursor:'pointer'}}
                        title={p.a + ' ↔ ' + p.b + ' · ' + fi(p.matchingUnits) + ' matching units'}>
                      {p.score}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Card>
  );
}

/* ---------------- sequence analysis ---------------- */
function SequenceView({ res, openPair }){
  const rows = res.pairs.filter(p => p.seq.len >= Math.min(3, res.cfg.minSeqLen)).sort((a, b) => b.seq.len - a.seq.len);
  const [open, setOpen] = useState(null);
  if (!rows.length) return <Card><Empty title="No repeated scan blocks found">
    No run of {res.cfg.minSeqLen} or more records repeats in the same order at another location. Lower the minimum sequence length in Settings to widen the search.
  </Empty></Card>;
  return (
    <div className="stack">
      <Card title={`Repeated scan blocks (${rows.length})`}
            sub="Records that appear in the same order at two locations. Original Excel row numbers are preserved." pad={false}>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr><th>Source</th><th>Potential repeat</th><th className="r">Records</th><th>Source rows</th><th>Repeat rows</th>
              <th className="r">Risk</th><th></th></tr></thead>
            <tbody>
              {rows.map(p => (
                <React.Fragment key={p.id}>
                  <tr className="clickable" onClick={() => setOpen(open === p.id ? null : p.id)}>
                    <td className="mono">{p.a}</td>
                    <td className="mono">{p.b}</td>
                    <td className="r num"><strong>{p.seq.len}</strong></td>
                    <td className="mono small">{p.seq.aFrom}–{p.seq.aTo}</td>
                    <td className="mono small">{p.seq.bFrom}–{p.seq.bTo}</td>
                    <td className="r"><Meter value={p.score} level={p.level} /></td>
                    <td className="r"><button className="btn sm ghost" onClick={e => { e.stopPropagation(); openPair(p); }}>Investigate</button></td>
                  </tr>
                  {open === p.id && (
                    <tr><td colSpan="7" style={{background:'var(--sunk)'}}>
                      <div className="small muted" style={{marginBottom:8}}>Repeated barcode sequence, in scan order:</div>
                      <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                        {p.seq.barcodes.map((b, i) => <span key={i} className="chip mono xs">{i + 1}. {b}</span>)}
                      </div>
                    </td></tr>
                  )}
                </React.Fragment>
              ))}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

/* ---------------- potential duplicate stock ---------------- */
function StockView({ res, openPair }){
  const rows = res.composition.filter(c => c.dupUnits > 0);
  if (!rows.length) return <Card><Empty title="No duplicate component isolated">Nothing in this file resolves into a duplicated stock component at the current thresholds.</Empty></Card>;
  return (
    <div className="stack">
      <div className="kpis">
        <Kpi k="Locations with a duplicate component" v={fi(rows.length)} tone="accent" />
        <Kpi k="Potential duplicate units" v={fi(res.totals.dupUnits)} tone="crit" />
        <Kpi k="Potential duplicate value" v={fm(res.totals.dupValue)} d="duplicated quantity × MRP" />
        <Kpi k="Unmatched stock at those locations" v={fi(rows.reduce((s, c) => s + c.genuine, 0))} d="treated as genuine" />
      </div>
      <Card title="Stock composition by location"
            sub="Each location split into its potentially duplicated component and its unmatched stock" pad={false}>
        <div className="tbl-wrap" style={{maxHeight:'66vh'}}>
          <table className="tbl">
            <thead><tr><th>Location</th><th style={{width:180}}>Composition</th><th className="r">Total units</th>
              <th className="r">Potentially duplicated</th><th className="r">Unmatched</th><th className="r">Duplicate %</th>
              <th className="r">Value at risk</th><th>Matched against</th></tr></thead>
            <tbody>
              {rows.map(c => (
                <tr key={c.lk}>
                  <td className="mono">{c.name}</td>
                  <td><Composition dup={c.dupUnits} genuine={c.genuine} /></td>
                  <td className="r num">{fi(c.units)}</td>
                  <td className="r num" style={{color:'var(--r-critical)'}}><strong>{fi(c.dupUnits)}</strong></td>
                  <td className="r num muted">{fi(c.genuine)}</td>
                  <td className="r num">{fp(c.dupPct)}</td>
                  <td className="r num">{fm(c.dupValue)}</td>
                  <td><div className="row" style={{gap:5}}>
                    {c.sources.slice(0, 4).map(s => (
                      <span key={s.otherKey} className="chip btn-like mono xs" onClick={() => openPair(s.pair)}>{s.other} · {fi(s.units)}u</span>
                    ))}
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>
      <div className="evidence">
        Duplicated quantity counts a matched unit once. Combined exposure — the same unit counted at both locations — is shown separately
        on each pair investigation so the two numbers are never mixed.
      </div>
    </div>
  );
}

/* ---------------- data quality ---------------- */
function QualityView({ quality, recs }){
  const [open, setOpen] = useState(null);
  const sev = { high:'critical', medium:'moderate', low:'low', master:'neutral' };
  if (!quality || !quality.length) return <Card><Empty title="No data quality issues found">Every row carries a location, a barcode and a readable quantity.</Empty></Card>;
  return (
    <div className="stack">
      <div className="evidence">
        Data-quality problems are kept separate from duplication findings. Master-data inconsistencies — one barcode with two articles,
        for instance — are never treated as duplicate scans.
      </div>
      <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))'}}>
        {quality.map((q, i) => (
          <div key={i} className="card" style={{cursor:'pointer'}} onClick={() => setOpen(open === i ? null : i)}>
            <div className="card-b">

                  <table className="tbl">
                    <thead><tr><th>{q.master ? 'Reference' : 'Excel row'}</th><th>Detail</th></tr></thead>
                    <tbody>
                      {(q.master || q.rows).slice(0, 60).map((r, j) => (

}

      const blob = await SG.exportExcel(res, fileName);
      const r = await SG.saveFile('Scan_Analytics_Report_' + new Date().toISOString().slice(0, 10) + '.xlsx', blob);

    try {
      await SG.saveFile('Scan_Analytics_Doubtful_Pairs.csv', SG.exportCSV(res), 'text/csv');
      toast('Doubtful pairs exported to CSV.');

    <div className="stack">
      <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(250px,1fr))'}}>
        <Card title="Excel audit report" sub="Twelve sheets, branded and filter-ready">
          <p className="small muted">Every sheet carries the Scan Analytics header, the thresholds used and the note that risk scores are patterns, not proof.</p>
          <button className="btn primary" onClick={excel} disabled={busy === 'excel'}>{busy === 'excel' ? 'Building…' : 'Download Excel report'}</button>
        </Card>
        <Card title="CSV extract" sub="Doubtful location pairs only">
          <p className="small muted">A flat table for pivoting or for loading into your own tracker.</p>
          <button className="btn" onClick={csv} disabled={busy === 'csv'}>{busy === 'csv' ? 'Building…' : 'Download CSV'}</button>
        </Card>
        <Card title="PDF / print" sub="Investigation summary as a document">
          <p className="small muted">Prints the screen you are on. Open a pair investigation first for a single-case PDF.</p>
          <button className="btn" onClick={() => window.print()}>Print or save as PDF</button>
        </Card>
      </div>
      <Card title="What the Excel report contains" pad={false}>
        <div className="tbl-wrap">
          <table className="tbl">
            <thead><tr><th style={{width:40}}>#</th><th>Sheet</th><th className="r">Rows</th></tr></thead>
            <tbody>
              {sheets.map((s, i) => {
                const counts = [1, res.composition.length, res.pairs.length,
                  res.pairs.reduce((n, p) => n + p.shared.length, 0),

                  res.pairs.filter(p => p.types.includes('exact') || p.types.includes('complete')).length,
                  res.pairs.filter(p => p.types.includes('partial')).length,
                  res.pairs.filter(p => p.types.includes('subset')).length,
                  res.pairs.filter(p => p.seq.len >= res.cfg.minSeqLen).length,
                  res.multiSource.reduce((n, m) => n + m.sources.length, 0),
                  (res.quality || []).reduce((n, q) => n + Math.min(200, q.count), 0),
                  res.pairs.length];
                return <tr key={s}><td className="mono muted">{i + 1}</td><td>{s}</td><td className="r num muted">{fi(counts[i])}</td></tr>;
              })}
            </tbody>
          </table>
        </div>
      </Card>
      <div className="evidence">{M.powered} · {M.footer}</div>
    </div>
  );
}

/* ---------------- settings ---------------- */
function SettingsView({ cfg, setCfg, rerun, clear, hasData }){
  const [d, setD] = useState(cfg);
  useEffect(() => setD(cfg), [cfg]);
  const num = (k, label, hint, min, max, step = 1) => (
    <label className="fld" key={k}>
      <span>{label}</span>
      <input type="number" min={min} max={max} step={step} value={d[k]}
             onChange={e => setD({ ...d, [k]:+e.target.value })} />
      <span className="xs muted">{hint}</span>
    </label>
  );
  const W = d.weights;
  const wSum = Object.values(W).reduce((a, b) => a + b, 0);
  return (
    <div className="stack">
      <Card title="Detection thresholds" sub="Defaults are tuned for retail physical-inventory files. Re-run the analysis after changing them.">
        <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))'}}>
          {num('minSharedBarcodes','Minimum matching barcodes','A pair needs at least this many shared barcodes', 1, 50)}
          {num('minMatchingUnits','Minimum matching units','Smaller overlaps are ignored', 1, 500)}
          {num('minPartialPct','Minimum overlap %','Share of the smaller location that must match', 1, 100)}
          {num('minSeqLen','Minimum repeated sequence','Records in the same scan order', 2, 100)}
          {num('commonBarcodePct','Ignore common barcodes above %','Barcodes in more than this share of locations stop generating pairs', 5, 100)}
          {num('valueThreshold','Value threshold (₹)','Hide pairs below this value at risk', 0, 10000000, 100)}
        </div>
      </Card>
      <Card title="Risk score weights" sub={`Relative weight of each factor. Current total ${wSum}.`}>
        <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(230px,1fr))'}}>
          {[['overlap','Barcode overlap'],['units','Unit match share'],['freq','Frequency match'],
            ['qtyAlign','Quantity alignment'],['article','Article match'],['mrp','MRP match'],
            ['sequence','Scan sequence'],['rarity','Barcode rarity']].map(([k, label]) => (
            <label className="fld" key={k}>
              <span>{label} <strong className="mono">{W[k]}</strong></span>
              <input type="range" min="0" max="40" value={W[k]}
                     onChange={e => setD({ ...d, weights:{ ...W, [k]:+e.target.value } })} />
            </label>
          ))}
        </div>
        <div className="evidence" style={{marginTop:14}}>
          Rarity is the false-positive control. Drop it and a barcode stocked in every store will start to look like evidence.
        </div>
      </Card>
      <div className="row">
        <button className="btn primary" onClick={() => { setCfg(d); rerun(d); }} disabled={!hasData}>Save and re-run analysis</button>
        <button className="btn" onClick={() => setD(JSON.parse(JSON.stringify(SG.DEFAULTS)))}>Reset to defaults</button>
        <div className="sp" style={{flex:1}} />
        <button className="btn" style={{color:'var(--bad)',borderColor:'var(--bad)'}} onClick={clear}>Clear analysis data</button>
      </div>
    </div>
  );
}

/* ---------------- about ---------------- */
function AboutView(){
  return (
    <div className="stack">
      <Card>
        <div style={{position:'relative'}}>
          <img src={LOGO_FULL} alt="Pro-Team Solutions" style={{height:66,marginBottom:16}} />
          <h1 style={{fontSize:28}}>{M.product}</h1>
          <p style={{fontSize:15,color:'var(--ink-2)',maxWidth:600}}>{M.tagline}</p>
          <div className="divider" />
          <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(210px,1fr))'}}>
            <div><div className="small muted">Created by</div><div>{M.author}</div><div className="small muted">{M.email}</div></div>
            <div><div className="small muted">Company</div><div>{M.company}</div><div className="small muted">Together we deliver</div></div>
            <div><div className="small muted">Processing</div><div>Entirely in your browser</div><div className="small muted">No audit data leaves this device</div></div>
          </div>
          <img src={LOGO_MARK} alt="" className="watermark" />
        </div>
      </Card>
      <Card title="How the engine reaches a conclusion">
        <ol style={{paddingLeft:20,margin:0,display:'flex',flexDirection:'column',gap:8}}>
          {[['Signatures, not row scans','Each location is reduced to a signature — barcode set, quantities, frequencies, article and MRP distribution and scan order. Pairs are generated from an inverted barcode index rather than comparing every row against every other row.'],
            ['Quantity-aware matching','A matched unit is counted once. If one location holds five and another three, the common quantity is three and two units stay with the first location.'],
            ['Rarity weighting','A barcode stocked across most locations carries almost no weight. A rare barcode appearing in a matching group carries a great deal.'],
            ['Component isolation','Where a location holds duplicated and genuine stock together, the duplicated component is isolated and reported separately from the rest.'],
            ['Explainability','Every flagged pair carries the reason it was flagged, the barcode-level evidence behind it, and the physical checks that would confirm or clear it.']].map(([t, d]) => (
            <li key={t}><strong>{t}.</strong> <span className="small muted">{d}</span></li>
          ))}
        </ol>
      </Card>
      <Card title="Reading the risk score">
        <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))'}}>
          {SG.LEVELS.slice().reverse().map(l => (
            <div key={l.key}><span className={'tag ' + l.key}>{l.label}</span>
              <div className="small muted" style={{marginTop:6}}>{l.min}–{l.key === 'critical' ? 100 : SG.LEVELS[SG.LEVELS.findIndex(x => x.key === l.key) - 1].min - 1}</div></div>
          ))}
        </div>
        <div className="evidence" style={{marginTop:14}}>
          The score describes a data pattern. It is not a finding of fraud, manipulation or misconduct — those conclusions belong to the
          audit team after physical cross-verification.
        </div>
      </Card>
    </div>
  );
}

/* ---------------- app shell ---------------- */
const NAV = [
  { g:'Analysis' },
  { k:'dashboard', t:'Dashboard', need:true },
  { k:'upload', t:'Upload & analyse' },
  { g:'Investigation' },
  { k:'doubtful', t:'Doubtful locations', need:true, badge:true },
  { k:'compare', t:'Location comparison', need:true },
  { k:'barcode', t:'Barcode explorer', need:true },
  { k:'network', t:'Duplication network', need:true },
  { k:'sequence', t:'Sequence analysis', need:true },
  { k:'stock', t:'Potential duplicate stock', need:true },
  { g:'Output' },
  { k:'quality', t:'Data quality', need:true },
  { k:'reports', t:'Reports', need:true },
  { k:'settings', t:'Settings' },
  { k:'about', t:'About' }
];
const TITLES = {
  dashboard:['Executive dashboard','Where the scan data disagrees with itself'],
  upload:['Upload & analyse','Read a file, map the columns, run the duplication engine'],
  doubtful:['Doubtful locations','Which locations to physically cross-check first'],
  compare:['Location comparison','Barcode-level evidence for one pair'],
  barcode:['Barcode explorer','Follow a single barcode across the audit'],
  network:['Duplication network','How suspicious locations connect'],
  sequence:['Sequence analysis','Repeated scan blocks in original row order'],
  stock:['Potential duplicate stock','Duplicated component isolated from genuine stock'],
  quality:['Data quality','Problems in the file itself, kept apart from duplication findings'],
  reports:['Reports','Export the investigation'],
  settings:['Settings','Thresholds and risk weights'],
  about:['About','Scan Analytics']
};

function App(){
  const [st, set] = useState({ view:'upload', wb:null, grid:null, headers:[], map:{}, headerRow:0,
    sheet:null, results:null, quality:null, recs:null, pair:null, progress:null, cfg:JSON.parse(JSON.stringify(SG.DEFAULTS)) });
  const [toastMsg, setToast] = useState(null);
  const [confirmClear, setConfirmClear] = useState(false);
  const toast = (m, err) => { setToast({ m, err }); setTimeout(() => setToast(null), 3800); };
  const go = v => set(s => ({ ...s, view:v }));
  const openPair = p => set(s => ({ ...s, pair:p, view:'compare' }));

  const runWith = useCallback(async (cfg, recsIn) => {
    const recs = recsIn || SG.buildDataset(st.grid.slice(st.headerRow + 1), st.headers, st.map, st.headerRow);
    if (!recs.length){ toast('No usable rows were found below the header row.', true); return; }
    const seen = [];
    set(s => ({ ...s, progress:{ label:'', pct:0, seen:[] }, view:'upload' }));
    const quality = SG.dataQuality(recs);
    try {
      const res = await SG.analyse(recs, cfg, (label, pct) => {
        set(s => ({ ...s, progress:{ label, pct, seen:seen.slice() } }));
        if (seen.indexOf(label) < 0) seen.push(label);
      });
      res.quality = quality;
      set(s => ({ ...s, results:res, quality, recs, progress:null, view:'dashboard', pair:null }));
      toast(res.pairs.length ? `${res.pairs.length} doubtful location pairs identified.` : 'Analysis complete — no duplication patterns found.');
    } catch (e){
      console.error(e);
      set(s => ({ ...s, progress:null }));
      toast('The analysis stopped: ' + e.message, true);
    }
  }, [st.grid, st.headers, st.map, st.headerRow]);

  const clear = () => {
    setConfirmClear(false);
    set({ view:'upload', wb:null, grid:null, headers:[], map:{}, headerRow:0, sheet:null, results:null,
      quality:null, recs:null, pair:null, progress:null, cfg:st.cfg });
    toast('Analysis data cleared.');
  };

  const res = st.results;
  const [title, sub] = TITLES[st.view] || ['', ''];

  const body = () => {
    if (st.view === 'upload') return <UploadView st={st} set={set} run={() => runWith(st.cfg)} toast={toast} />;
    if (st.view === 'settings') return <SettingsView cfg={st.cfg} setCfg={c => set(s => ({ ...s, cfg:c }))}
      rerun={c => runWith(c, st.recs)} clear={() => setConfirmClear(true)} hasData={!!st.recs} />;
    if (st.view === 'about') return <AboutView />;
    if (!res) return <Card><Empty title="Upload an inventory audit file to begin duplication analysis"
      action={<button className="btn primary" onClick={() => go('upload')}>Go to upload</button>}>
      Once a file is analysed, this screen fills with evidence drawn from your own scan data.
    </Empty></Card>;
    switch (st.view){
      case 'dashboard': return <Dashboard res={res} go={go} openPair={openPair} />;
      case 'doubtful': return <DoubtfulView res={res} openPair={openPair} />;
      case 'compare': return st.pair
        ? <PairView p={st.pair} res={res} back={() => go('doubtful')} toast={toast} />
        : <Card><Empty title="No pair selected"
            action={<button className="btn primary" onClick={() => go('doubtful')}>Choose a location pair</button>}>
            Pick a pair from the doubtful locations table to see its barcode-level comparison.</Empty></Card>;
      case 'barcode': return <BarcodeView res={res} openPair={openPair} />;
      case 'network': return <NetworkView res={res} openPair={openPair} />;
      case 'sequence': return <SequenceView res={res} openPair={openPair} />;
      case 'stock': return <StockView res={res} openPair={openPair} />;
      case 'quality': return <QualityView quality={st.quality} recs={st.recs} />;
      case 'reports': return <ReportsView res={res} fileName={st.wb ? st.wb.name : '—'} toast={toast} />;
      default: return null;
    }
  };

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="brand">
          <img src={LOGO_FULL} alt="Pro-Team Solutions" />
          <div className="prod">{M.product}</div>
          <div className="sub">{M.tagline}</div>
        </div>
        <nav className="nav">
          {NAV.map((n, i) => n.g
            ? <div className="nav-group" key={'g' + i}>{n.g}</div>
            : <button key={n.k} className={st.view === n.k ? 'active' : ''}
                      disabled={n.need && !res} onClick={() => go(n.k)}>
                {n.t}
                {n.badge && res && res.totals.counts.critical > 0 && <span className="pill">{res.totals.counts.critical}</span>}
              </button>)}
        </nav>
        <div className="side-foot"><span>{M.footer}</span></div>
      </aside>

      <main className="main">
        <header className="topbar">
          <div>
            <div className="crumb">{M.company} · audit investigation</div>
            <h2>{title}</h2>
          </div>
          <div className="sp" />
          {res && <span className="small muted no-print">{st.wb ? st.wb.name : ''} · {fi(res.totals.rows)} rows · {fi(res.totals.locations)} locations</span>}
        </header>
        <div className="page">
          <div className="small muted no-print" style={{marginBottom:14,marginTop:-4}}>{sub}</div>
          {body()}
          <div className="small muted" style={{marginTop:34,paddingTop:14,borderTop:'1px solid var(--line)'}}>
            {M.footer} · {M.company}
          </div>
        </div>
      </main>

      {toastMsg && <div className={'toast' + (toastMsg.err ? ' err' : '')}>{toastMsg.m}</div>}
      {confirmClear && (
        <div className="modal-bg" onClick={() => setConfirmClear(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="card-h"><h3>Clear the current analysis?</h3></div>
            <div className="card-b">
              <p className="small">The loaded file, the mapping and every finding on screen will be removed from this session. Exports you have already downloaded are unaffected.</p>
              <div className="row" style={{justifyContent:'flex-end',marginTop:14}}>
                <button className="btn ghost" onClick={() => setConfirmClear(false)}>Keep the analysis</button>
                <button className="btn" style={{color:'var(--bad)',borderColor:'var(--bad)'}} onClick={clear}>Clear analysis data</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
